<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鱷魚拔牙 · GAMEPOKE!</title><style>
*{box-sizing:border-box}body{margin:0;color:#284b35;background:#fff7e7;font-family:'PingFang TC','Microsoft JhengHei',system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:clamp(28px,5vw,44px);margin:0}p{line-height:1.7}button{font:inherit;font-weight:900;cursor:pointer;border:3px solid #254d35;border-radius:15px;padding:12px 20px;background:#fff;color:#254d35;box-shadow:0 4px 0 #254d35}button:focus-visible{outline:4px solid #e88b14;outline-offset:4px}button:disabled{cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap}.primary{background:#ffcf50}.status{text-align:center;background:white;border:3px solid #294d36;border-radius:20px;padding:15px;margin:18px 0;font-size:clamp(20px,3vw,30px);font-weight:900;min-height:85px}.status small{display:block;font-size:16px;margin-top:5px;font-weight:600}
.scene{position:relative;height:610px;border:3px solid #34523d;border-radius:35px;overflow:hidden;background:radial-gradient(ellipse at 50% 95%,#bcd29e,#eff4de 60%);box-shadow:0 7px #d7c9a4}.croc{position:absolute;top:20px;left:50%;width:480px;max-width:96%;height:565px;transform:translateX(-50%);filter:drop-shadow(0 14px 8px #1e452b40)}.tray{position:absolute;left:0;top:190px;width:100%;height:370px}.head{position:absolute;top:0;left:0;width:100%;height:265px;z-index:4;transform-origin:50% 83%;filter:drop-shadow(0 8px 4px #1d442b55)}.teeth{position:absolute;inset:0;z-index:3}.tooth{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);padding:0;transform:translate(-50%,-50%) rotate(var(--angle));border:0;border-radius:35%;background:none;box-shadow:none;transition:filter .15s,opacity .15s;isolation:isolate}.tooth svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 1px #84241c);pointer-events:none}.tooth .number{position:absolute;left:0;right:0;top:48%;font-size:11px;font-weight:800;color:#73684e;pointer-events:none}.tooth:hover:not(:disabled){filter:drop-shadow(0 0 5px #ffc92a)}.tooth.pressed{transform:translate(-50%,-50%) rotate(var(--angle)) scaleY(.45);opacity:.55}.tooth.danger{filter:sepia(.7) saturate(3);opacity:1}.tooth:focus-visible{outline:3px solid #123cbd;outline-offset:3px}.burst{position:absolute;top:265px;left:0;right:0;text-align:center;color:#fff1a6;text-shadow:3px 3px #71372c;font-size:48px;font-weight:1000;z-index:6;opacity:0;pointer-events:none}.closed .head{animation:toyBite 1.4s both}.closed .teeth{animation:hideTeeth 1.4s forwards}.closed .burst{animation:pop .25s 1.2s both}.counter{text-align:center;margin:18px 0;font-size:20px;font-weight:800}.bottom{text-align:center}.hint{font-size:15px;color:#55725b}dialog{max-width:540px;border:4px solid #294d36;border-radius:24px;padding:26px;background:#fff9e9;color:#294d36}dialog::backdrop{background:#23422b99}@keyframes toyBite{0%{transform:translateY(0) rotateX(0)}18%{transform:translateY(-10px) rotateX(-8deg)}38%{transform:translateY(230px) rotateX(16deg)}58%{transform:translateY(65px) rotateX(0)}78%{transform:translateY(230px) rotateX(16deg)}88%{transform:translateY(145px) rotateX(8deg)}100%{transform:translateY(230px) rotateX(16deg)}}@keyframes hideTeeth{0%,20%,55%{opacity:1}38%,78%,100%{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}@media(max-width:600px){main{padding:14px}.scene{height:520px}.croc{width:390px;height:480px;top:16px}.head{height:225px}.tray{top:160px;height:315px}.tooth{width:calc(var(--w)*.82);height:calc(var(--h)*.82)}.tooth .number{font-size:9px}.burst{top:240px;font-size:40px}@keyframes toyBite{0%{transform:translateY(0)}18%{transform:translateY(-8px)}38%{transform:translateY(192px)}58%{transform:translateY(55px)}78%{transform:translateY(192px)}88%{transform:translateY(125px)}100%{transform:translateY(192px)}}}@media(prefers-reduced-motion:reduce){.closed .head{animation:none;transform:translateY(230px)}.closed .teeth{animation:none;opacity:0}.closed .burst{animation:none;opacity:1}}
 .closed .tray{animation:foldInside 1.4s forwards}@keyframes foldInside{0%,20%,55%{clip-path:inset(0)}38%,78%,100%{clip-path:inset(65% 0 0)}}@media(prefers-reduced-motion:reduce){.closed .tray{animation:none;clip-path:inset(65% 0 0)}} </style></head><body><main><header><h1>🐊 鱷魚拔牙</h1><div class="controls"><button id="sound" aria-pressed="false">♪ 音效：關</button><button id="rules">玩法說明</button></div></header><p>下排 20 顆，誰會碰到鱷魚的危險牙？由老師安排下一位學員，選一顆牙按下去！</p><div class="status" role="status" aria-live="polite"><span id="message">鱷魚張嘴了，選一顆牙！</span><small id="detail">20 顆牙裡，藏著 1 顆危險牙。</small></div><section class="scene" aria-label="鱷魚的嘴巴"><div class="croc" id="croc"><svg class="tray" viewBox="0 0 480 370" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="red" x2="0" y2="1"><stop stop-color="#92231c"/><stop offset=".5" stop-color="#e94a24"/><stop offset="1" stop-color="#ff6930"/></linearGradient></defs><path d="M57 12Q240 -15 422 12L455 200Q456 354 240 363Q23 354 25 200Z" fill="#46b53a" stroke="#217c35" stroke-width="7"/><path d="M68 22Q240 0 410 22L436 200Q440 333 240 344Q40 333 43 200Z" fill="url(#red)" stroke="#a13121" stroke-width="5"/><path d="M93 50Q240 17 385 50L402 184Q410 279 240 293Q71 279 77 184Z" fill="#bc321e" stroke="#ef7043" stroke-width="7"/><path d="M148 218Q239 167 332 218Q351 277 240 285Q129 277 148 218" fill="#da4427"/><path d="M238 211L240 267" stroke="#b83022" stroke-width="4"/><path d="M69 286Q109 328 192 332" stroke="#ff9970" opacity=".55" stroke-width="7" fill="none" stroke-linecap="round"/></svg><div class="teeth" id="lower" role="group" aria-label="下排二十顆牙齒"></div><svg class="head" viewBox="0 0 480 265" aria-hidden="true"><defs><radialGradient id="green"><stop stop-color="#a0ef58"/><stop offset=".55" stop-color="#54c82f"/><stop offset="1" stop-color="#168438"/></radialGradient><linearGradient id="snout" x2="0" y2="1"><stop stop-color="#84e748"/><stop offset=".55" stop-color="#3ebb2c"/><stop offset="1" stop-color="#167733"/></linearGradient></defs><path d="M95 157C91 60 142 9 194 37Q238 7 269 38C332 9 388 77 380 163Z" fill="url(#green)" stroke="#227b37" stroke-width="5"/><path d="M141 123Q136 58 182 58Q218 61 217 128M263 128Q261 58 305 58Q346 65 339 130" fill="#ecfff0" stroke="#59a97a" stroke-width="4"/><ellipse cx="183" cy="100" rx="19" ry="26" fill="#4c7433"/><ellipse cx="299" cy="100" rx="19" ry="26" fill="#4c7433"/><ellipse cx="185" cy="102" rx="10" ry="18" fill="#17362a"/><ellipse cx="297" cy="102" rx="10" ry="18" fill="#17362a"/><circle cx="180" cy="91" r="6" fill="white"/><circle cx="293" cy="91" r="6" fill="white"/><path d="M137 58L214 81M268 81L343 58" stroke="#38a835" stroke-width="14" stroke-linecap="round"/><path d="M30 220C31 131 115 103 240 118C365 103 449 138 449 220Q240 280 30 220" fill="url(#snout)" stroke="#227b37" stroke-width="6"/><path d="M240 126Q227 173 239 224" fill="none" stroke="#299430" stroke-width="5" opacity=".6"/><path d="M69 187C64 146 130 147 146 184Q157 223 123 220Q102 217 109 203Q117 188 94 192Q73 197 69 187M411 187C416 146 350 147 334 184Q323 223 357 220Q378 217 371 203Q363 188 386 192Q407 197 411 187" fill="#193d27"/><path d="M55 230Q240 273 428 230" fill="none" stroke="#144e2c" stroke-width="7"/><path d="M76 146Q115 128 166 131" stroke="#cbff98" stroke-width="9" opacity=".45" fill="none" stroke-linecap="round"/></svg><div class="burst" aria-hidden="true">喀嚓！</div></div></section><div class="counter" id="counter">剩餘 20 顆 · 已按 0 顆</div><div class="bottom"><button class="primary" id="restart">重新開局 · 張嘴 ⟳</button><p class="hint">每局隨機選一顆危險牙；按過的牙不能再按。沒有玩家人數設定。</p></div><dialog id="dialog"><h2>🐊 玩法說明</h2><p>老師自行安排學員輪流操作，每次選一顆尚未按過的牙齒。只有下排 20 顆，數字方便指出位置。</p><p>安全牙會縮下去；碰到隱藏的危險牙，鱷魚就會閉嘴，本局結束！按「重新開局」會全部復原，並重新隨機選擇危險牙。</p><p>牙齒外形依位置呈現不同透視，不代表是否危險；每顆牙在開局時被選為危險牙的機率相同。</p><button id="close">知道了</button></dialog></main><script>
(()=>{const $=id=>document.getElementById(id);let biteTimer;let danger,ended=false,pressed=new Set(),sound=false,audio;function random(){let n;const a=new Uint32Array(1);do{crypto.getRandomValues(a);n=a[0]}while(n>=4294967280);return n%20}function tone(bite){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const start=audio.currentTime;if(!bite){const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(660,start);o.frequency.exponentialRampToValueAtTime(900,start+.12);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.1,start+.01);g.gain.exponentialRampToValueAtTime(.0001,start+.17);o.connect(g);g.connect(audio.destination);o.start(start);o.stop(start+.18);return;}const master=audio.createGain(),compress=audio.createDynamicsCompressor();master.gain.value=.7;master.connect(compress);compress.connect(audio.destination);compress.threshold.value=-18;compress.ratio.value=8;const noise=audio.createBuffer(1,Math.ceil(audio.sampleRate*1.45),audio.sampleRate),samples=noise.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;const growl=audio.createBufferSource(),filter=audio.createBiquadFilter(),growlGain=audio.createGain();growl.buffer=noise;filter.type='lowpass';filter.frequency.setValueAtTime(480,start);filter.frequency.exponentialRampToValueAtTime(130,start+1.35);growlGain.gain.setValueAtTime(.0001,start);growlGain.gain.exponentialRampToValueAtTime(.8,start+.12);growlGain.gain.exponentialRampToValueAtTime(.0001,start+1.4);growl.connect(filter);filter.connect(growlGain);growlGain.connect(master);growl.start(start);for(const delay of [.48,1.02]){const t=start+delay,o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(38,t+.25);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.38,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(master);o.start(t);o.stop(t+.31);const snap=audio.createBufferSource(),hp=audio.createBiquadFilter(),sg=audio.createGain();snap.buffer=noise;hp.type='highpass';hp.frequency.value=1100;sg.gain.setValueAtTime(.45,t);sg.gain.exponentialRampToValueAtTime(.0001,t+.1);snap.connect(hp);hp.connect(sg);sg.connect(master);snap.start(t,0,.11);}}catch{}}
function draw(){$('lower').replaceChildren();for(let i=0;i<20;i++){const b=document.createElement('button'),theta=Math.PI-i*Math.PI/19,front=Math.sin(theta),side=Math.cos(theta),lean=side*(1-front)*12;const width=27+16*front+((i%3)-1)*.6,height=25+23*front+((i%4)-1.5)*.5;const l=17+lean,r=83+lean,tip=50+lean*1.3+(i%2?2:-2),crown=7+(1-front)*10;const shape=`M ${l} 88 Q ${l-7} 60 ${l+5} 30 Q ${tip-17} ${crown-4} ${tip} ${crown} Q ${tip+21} ${crown-2} ${r-3} 32 Q ${r+6} 62 ${r} 88 Q 51 103 ${l} 88 Z`;b.className='tooth';b.style.setProperty('--w',width+'px');b.style.setProperty('--h',height+'px');const rim=[[72,282],[65,322],[61,362],[62,402],[72,441],[94,475],[124,500],[158,517],[192,527],[224,531]],root=rim[i<10?i:19-i],rootX=i<10?root[0]:480-root[0];b.style.setProperty('--x',((rootX-side*11)/480*100)+'%');b.style.setProperty('--y',((root[1]-height*.4*front)/565*100)+'%');b.style.setProperty('--angle',(-side*(15+12*(1-front)))+'deg');b.innerHTML=`<svg viewBox="0 0 100 105" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ivory${i}" x1="${side>0?'0':'1'}" y1="0" x2="${side>0?'1':'0'}" y2=".6"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#fffef0"/><stop offset="1" stop-color="#b9b7a0"/></linearGradient></defs><path d="${shape}" fill="url(#ivory${i})" stroke="#918d70" stroke-width="3"/><path d="M ${l+7} 76 Q ${l+2} 39 ${tip-8} ${crown+8}" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity=".85"/><path d="M ${l+1} 87 Q 52 98 ${r-2} 86" fill="none" stroke="#aaa58c" stroke-width="4" opacity=".65"/></svg><span class="number">${i+1}</span>`;b.setAttribute('aria-label',`下排第 ${i+1} 顆牙齒`);b.onclick=()=>press(i,b);$('lower').append(b)}}function press(id,b){if(ended||pressed.has(id))return;pressed.add(id);b.disabled=true;b.classList.add('pressed');const bite=id===danger;tone(bite);if(bite){ended=true;b.classList.add('danger');$('restart').disabled=true;$('croc').classList.add('closed');biteTimer=setTimeout(()=>{$('restart').disabled=false},1700);document.querySelectorAll('.tooth').forEach(t=>t.disabled=true);$('message').textContent='喀嚓！碰到危險牙了！';$('detail').textContent=`下排第 ${id+1} 顆是危險牙，本局結束。`}else{$('message').textContent='安全過關！換下一位來挑戰！';$('detail').textContent=`下排第 ${id+1} 顆是安全牙。`}$('counter').textContent=`剩餘 ${20-pressed.size} 顆 · 已按 ${pressed.size} 顆`}function reset(){clearTimeout(biteTimer);$('restart').disabled=false;danger=random();ended=false;pressed.clear();$('croc').classList.remove('closed');draw();$('message').textContent='鱷魚張嘴了，選一顆牙！';$('detail').textContent='20 顆牙裡，藏著 1 顆危險牙。';$('counter').textContent='剩餘 20 顆 · 已按 0 顆'}$('restart').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=`♪ 音效：${sound?'開':'關'}`;$('sound').setAttribute('aria-pressed',String(sound));if(sound)tone(false)};$('rules').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();reset()})();
</script></body></html>
