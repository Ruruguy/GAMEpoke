<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鱷魚拔牙 · GAMEPOKE!</title><style>
*{box-sizing:border-box}body{margin:0;color:#284b35;background:#fff7e7;font-family:'PingFang TC','Microsoft JhengHei',system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:clamp(28px,5vw,44px);margin:0}p{line-height:1.7}button{font:inherit;font-weight:900;cursor:pointer;border:3px solid #254d35;border-radius:15px;padding:12px 20px;background:#fff;color:#254d35;box-shadow:0 4px 0 #254d35}button:focus-visible{outline:4px solid #e88b14;outline-offset:4px}button:disabled{cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap}.primary{background:#ffcf50}.status{text-align:center;background:white;border:3px solid #294d36;border-radius:20px;padding:15px;margin:18px 0;font-size:clamp(20px,3vw,30px);font-weight:900;min-height:85px}.status small{display:block;font-size:16px;margin-top:5px;font-weight:600}.scene{position:relative;height:420px;background:radial-gradient(ellipse at bottom,#d8edb4,#e9f5d9 65%);border:3px solid #34523d;border-radius:35px;overflow:hidden;box-shadow:0 7px #d7c9a4}.croc{position:absolute;width:90%;max-width:820px;height:365px;left:50%;top:38px;transform:translateX(-50%)}.mouth{position:absolute;inset:70px 0 0;background:#863841;border:8px solid #295238;border-radius:85px;box-shadow:inset 0 15px #5d2830}.tongue{position:absolute;width:45%;height:80px;border-radius:50%;background:#e8787e;bottom:35px;left:27.5%;border:5px solid #c15c69}.jaw{position:absolute;left:0;width:100%;background:linear-gradient(#92ce67,#6aae50);border:7px solid #295238;border-radius:70px;z-index:2}.upper{top:20px;height:135px;transition:transform .38s cubic-bezier(.45,0,.9,.45);transform-origin:center}.lower{bottom:0;height:104px}.eyes{position:absolute;top:-25px;left:22%;width:56%;display:flex;justify-content:space-between}.eye{width:70px;height:70px;border:6px solid #295238;background:#faffea;border-radius:50%;position:relative;box-shadow:0 -8px 0 7px #79bc57}.eye:after{content:'';position:absolute;inset:17px 14px 10px 25px;border-radius:50%;background:#223d2d;border:5px solid #223d2d;box-shadow:inset 5px 3px white}.nose{position:absolute;top:40px;left:44%;width:12%;display:flex;justify-content:space-between}.nose i{width:13px;height:8px;background:#35663e;border-radius:50%}.teeth{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;position:absolute;width:91%;left:4.5%}.upper .teeth{bottom:-23px}.lower .teeth{top:-24px}.tooth{padding:0;height:58px;min-width:0;background:linear-gradient(100deg,#fff,#ffefc7);border:3px solid #614c31;border-radius:12px 12px 20px 20px;box-shadow:0 5px 0 #aa8754;font-size:clamp(12px,2vw,20px);color:#674f34;transition:transform .15s,opacity .15s}.lower .tooth{border-radius:20px 20px 12px 12px}.tooth:hover:not(:disabled){background:#fff1a0;transform:translateY(-4px)}.tooth.pressed{transform:translateY(-13px) scale(.84);opacity:.4;box-shadow:none}.lower .tooth.pressed{transform:translateY(13px) scale(.84)}.tooth.danger{background:#ff7474;color:#651b25;border-color:#651b25;opacity:1}.closed .upper{transform:translateY(150px);z-index:3}.closed .tongue{opacity:0}.closed .eye:after{inset:27px 10px 18px;border-radius:8px;transform:rotate(-12deg)}.burst{position:absolute;top:115px;left:0;right:0;text-align:center;font-size:clamp(35px,7vw,65px);font-weight:1000;color:#fff4c0;text-shadow:3px 3px #912e38;z-index:5;pointer-events:none;opacity:0}.closed .burst{animation:pop .5s .25s both}.counter{text-align:center;margin:18px 0;font-size:20px;font-weight:800}.bottom{text-align:center}.hint{font-size:15px;color:#55725b}dialog{max-width:540px;border:4px solid #294d36;border-radius:24px;padding:26px;background:#fff9e9;color:#294d36}dialog::backdrop{background:#23422b99}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@media(max-width:600px){main{padding:14px}.scene{height:345px}.croc{height:295px;top:38px;width:95%}.upper{height:105px}.lower{height:80px}.mouth{border-radius:45px}.jaw{border-radius:40px;border-width:5px}.teeth{gap:2px;width:96%;left:2%}.tooth{height:45px;border-width:2px;border-radius:7px}.eye{width:55px;height:55px}.eye:after{inset:12px 10px 8px 18px}.closed .upper{transform:translateY(118px)}.nose{top:27px}.burst{top:90px}.status{min-height:92px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.closed .burst{opacity:1}}
</style></head><body><main><header><h1>🐊 鱷魚拔牙</h1><div class="controls"><button id="sound" aria-pressed="false">♪ 音效：關</button><button id="rules">玩法說明</button></div></header><p>上下各 12 顆，誰會碰到鱷魚的危險牙？由老師安排下一位學員，選一顆牙按下去！</p><div class="status" role="status" aria-live="polite"><span id="message">鱷魚張嘴了，選一顆牙！</span><small id="detail">24 顆牙裡，藏著 1 顆危險牙。</small></div><section class="scene" aria-label="鱷魚的嘴巴"><div class="croc" id="croc"><div class="mouth"><div class="tongue"></div></div><div class="jaw upper"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="nose"><i></i><i></i></div><div class="teeth" id="upper" role="group" aria-label="上排十二顆牙齒"></div></div><div class="jaw lower"><div class="teeth" id="lower" role="group" aria-label="下排十二顆牙齒"></div></div><div class="burst" aria-hidden="true">喀嚓！</div></div></section><div class="counter" id="counter">剩餘 24 顆 · 已按 0 顆</div><div class="bottom"><button class="primary" id="restart">重新開局 · 張嘴 ⟳</button><p class="hint">每局隨機選一顆危險牙；按過的牙不能再按。沒有玩家人數設定。</p></div><dialog id="dialog"><h2>🐊 玩法說明</h2><p>老師自行安排學員輪流操作，每次選一顆尚未按過的牙齒。上下排各 12 顆，數字方便指出位置。</p><p>安全牙會縮下去；碰到隱藏的危險牙，鱷魚就會閉嘴，本局結束！按「重新開局」會全部復原，並重新隨機選擇危險牙。</p><p>所有未按過的牙看起來都一樣；每顆牙在開局時被選為危險牙的機率相同。</p><button id="close">知道了</button></dialog></main><script>
(()=>{const $=id=>document.getElementById(id);let danger,ended=false,pressed=new Set(),sound=false,audio;function random(){let n;const a=new Uint32Array(1);do{crypto.getRandomValues(a);n=a[0]}while(n>=4294967280);return n%24}function tone(bite){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const start=audio.currentTime;[0,.09,.18].slice(0,bite?3:1).forEach((delay,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=bite?'sawtooth':'sine';o.frequency.setValueAtTime(bite?180-i*35:660,start+delay);o.frequency.exponentialRampToValueAtTime(bite?55:900,start+delay+.12);g.gain.setValueAtTime(.0001,start+delay);g.gain.exponentialRampToValueAtTime(.12,start+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,start+delay+.17);o.connect(g);g.connect(audio.destination);o.start(start+delay);o.stop(start+delay+.18)})}catch{}}function draw(){for(const [row,offset] of [['upper',0],['lower',12]]){$(row).replaceChildren();for(let i=0;i<12;i++){const b=document.createElement('button'),id=i+offset;b.className='tooth';b.textContent=i+1;b.setAttribute('aria-label',`${offset?'下':'上'}排第 ${i+1} 顆牙齒`);b.onclick=()=>press(id,b);$(row).append(b)}}}function press(id,b){if(ended||pressed.has(id))return;pressed.add(id);b.disabled=true;b.classList.add('pressed');const bite=id===danger;tone(bite);if(bite){ended=true;b.classList.add('danger');$('croc').classList.add('closed');document.querySelectorAll('.tooth').forEach(t=>t.disabled=true);$('message').textContent='喀嚓！碰到危險牙了！';$('detail').textContent=`${id<12?'上':'下'}排第 ${id%12+1} 顆是危險牙，本局結束。`}else{$('message').textContent='安全過關！換下一位來挑戰！';$('detail').textContent=`${id<12?'上':'下'}排第 ${id%12+1} 顆是安全牙。`}$('counter').textContent=`剩餘 ${24-pressed.size} 顆 · 已按 ${pressed.size} 顆`}function reset(){danger=random();ended=false;pressed.clear();$('croc').classList.remove('closed');draw();$('message').textContent='鱷魚張嘴了，選一顆牙！';$('detail').textContent='24 顆牙裡，藏著 1 顆危險牙。';$('counter').textContent='剩餘 24 顆 · 已按 0 顆'}$('restart').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=`♪ 音效：${sound?'開':'關'}`;$('sound').setAttribute('aria-pressed',String(sound));if(sound)tone(false)};$('rules').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();reset()})();
</script></body></html>
