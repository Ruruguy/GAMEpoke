x}.mouth{border-radius:45px}.jaw{border-radius:40px;border-width:5px}.teeth{gap:2px;width:96%;left:2%}.tooth{height:45px;border-width:2px;border-radius:7px}.eye{width:55px;height:55px}.eye:after{inset:12px 10px 8px 18px}.closed .upper{transform:translateY(118px)}.nose{top:27px}.burst{top:90px}.status{min-height:92px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.closed .burst{opacity:1}}

.scene{height:600px;background:radial-gradient(ellipse at 50% 95%,#bfd99b 0,#e6f2d7 55%,#faf5df 100%)}.croc{--gape:1;top:35px;width:420px;max-width:92%;height:530px;filter:drop-shadow(0 15px 9px #345c3a30)}.mouth{inset:75px 12px 8px;border:13px solid #25533b;border-radius:45% 45% 42% 42% / 26% 26% 30% 30%;background:radial-gradient(ellipse at 50% 20%,#280e17 0,#511824 40%,#a84043 90%);box-shadow:inset 0 0 0 12px #d85d5d,inset 0 0 0 20px #8f353b,0 0 0 8px #79ba4f;transform:scaleY(calc(.12 + .88 * var(--gape)));transform-origin:50% 50%}.tongue{width:58%;height:105px;bottom:22px;left:21%;border-radius:55% 55% 35% 35%;background:linear-gradient(#e48682,#b84550);border-color:#8b2e3a;box-shadow:inset 0 12px #f4978e55}.tongue:after{content:'';position:absolute;width:3px;height:55px;background:#ad4a57;left:50%;top:10px;border-radius:50%}.jaw{border:0;background:none;border-radius:0;inset:0;width:100%;height:100%;pointer-events:none;transition:none;transform:none}.snout{position:absolute;top:20px;width:100%;height:116px;background:radial-gradient(ellipse at 40% 10%,#b2e886,#79bd51 55%,#418653);border:8px solid #25533b;border-radius:48% 48% 20% 20% / 80% 80% 20% 20%;transform:translateY(calc(145px * (1 - var(--gape))));z-index:4;box-shadow:inset 0 9px #d9f9a855}.eyes{top:-27px;left:19%;width:62%;z-index:5}.eye{width:77px;height:77px;background:#fff3ab;border-width:6px;box-shadow:0 -9px 0 8px #79bc57}.eye:after{inset:14px 20px 8px;border:0;background:radial-gradient(circle at 40% 24%,white 0 12%,#263c31 14% 100%);box-shadow:none}.nose{top:64px;left:40%;width:20%}.nose i{width:20px;height:9px;transform:rotate(10deg);background:#244b35}.nose i:last-child{transform:rotate(-10deg)}.teeth,.upper .teeth,.lower .teeth{inset:0;width:100%;height:100%;display:block;pointer-events:none}.tooth{position:absolute;left:var(--x);top:calc(52% + (var(--y) - 52%) * var(--gape));width:48px;height:57px;border:2px solid #957e66;background:radial-gradient(ellipse at 30% 15%,white 0,#fffbee 48%,#dccc </style></head><body><main><header><h1>🐊 鱷魚拔牙</h1><div class="controls"><button id="sound" aria-pressed="false">♪ 音效：關</button><button id="rules">玩法說明</button></div></header><p>上下各 12 顆，誰會碰到鱷魚的危險牙？由老師安排下一位學員，選一顆牙按下去！</p><div class="status" role="status" aria-live="polite"><span id="message">鱷魚張嘴了，選一顆牙！</span><small id="detail">24 顆牙裡，藏著 1 顆危險牙。</small></div><section class="scene" aria-label="鱷魚的嘴巴"><div class="croc" id="croc"><div class="mouth"><div class="tongue"></div></div><div class="jaw upper"><div class="snout"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="nose"><i></i><i></i></div></div><div class="teeth" id="upper" role="group" aria-label="上排十二顆牙齒"></div></div><div class="jaw lower"><div class="chin"></div><div class="teeth" id="lower" role="group" aria-label="下排十二顆牙齒"></div></div><div class="burst" aria-hidden="true">喀嚓！</div></div></section><div class="counter" id="counter">剩餘 24 顆 · 已按 0 顆</div><div class="bottom"><button class="primary" id="restart">重新開局 · 張嘴 ⟳</button><p class="hint">每局隨機選一顆危險牙；按過的牙不能再按。沒有玩家人數設定。</p></div><dialog id="dialog"><h2>🐊 玩法說明</h2><p>老師自行安排學員輪流操作，每次選一顆尚未按過的牙齒。上下排各 12 顆，數字方便指出位置。</p><p>安全牙會縮下去；碰到隱藏的危險牙，鱷魚就會閉嘴，本局結束！按「重新開局」會全部復原，並重新隨機選擇危險牙。</p><p>所有未按過的牙看起來都一樣；每顆牙在開局時被選為危險牙的機率相同。</p><button id="close">知道了</button></dialog></main><script>
(()=>{const $=id=>document.getElementById(id);let biteTimer;let danger,ended=false,pressed=new Set(),sound=false,audio;function random(){let n;const a=new Uint32Array(1);do{crypto.getRandomValues(a);n=a[0]}while(n>=4294967280);return n%24}function tone(bite){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const start=audio.currentTime;[0,.09,.18].slice(0,bite?3:1).forEach((delay,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=bite?'sawtooth':'sine';o.frequency.setValueAtTime(bite?180-i*35:660,start+delay);o.frequency.exponentialRampToValueAtTime(bite?55:900,start+delay+.12);g.gain.setValueAtTime(.0001,start+delay);g.gain.exponentialRampToValueAtTime(.12,start+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,start+delay+.17);o.connect(g);g.connect(audio.destination);o.start(start+delay);o.stop(start+delay+.18)})}catch{}}function draw(){for(const [row,offset] of [['upper',0],['lower',12]]){$(row).replaceChildren();for(let i=0;i<12;i++){const b=document.createElement('button'),id=i+offset;b.className='tooth';b.textContent=i+1;const points=[[13,46,-75],[12,39,-65],[14,29,-45],[23,22,-25],[35,19,-10],[46,18,0],[57,18,0],[69,19,10],[80,22,25],[87,29,45],[89,39,65],[88,46,75]];const [x,y,a]=points[i];b.style.setProperty('--x',x+'%');b.style.setProperty('--y',(offset?104-y:y)+'%');b.style.setProperty('--angle',(offset?-a:a)+'deg');b.setAttribute('aria-label',`${offset?'下':'上'}排第 ${i+1} 顆牙齒`);b.onclick=()=>press(id,b);$(row).append(b)}}}function press(id,b){if(ended||pressed.has(id))return;pressed.add(id);b.disabled=true;b.classList.add('pressed');const bite=id===danger;tone(bite);if(bite){ended=true;b.classList.add('danger');$('restart').disabled=true;$('croc').classList.add('closed');biteTimer=setTimeout(()=>{$('restart').disabled=false},1700);document.querySelectorAll('.tooth').forEach(t=>t.disabled=true);$('message').textContent='喀嚓！碰到危險牙了！';$('detail').textContent=`${id<12?'上':'下'}排第 ${id%12+1} 顆是危險牙，本局結束。`}else{$('message').textContent='安全過關！換下一位來挑戰！';$('detail').textContent=`${id<12?'上':'下'}排第 ${id%12+1} 顆是安全牙。`}$('counter').textContent=`剩餘 ${24-pressed.size} 顆 · 已按 ${pressed.size} 顆`}function reset(){clearTimeout(biteTimer);$('restart').disabled=false;danger=random();ended=false;pressed.clear();$('croc').classList.remove('closed');draw();$('message').textContent='鱷魚張嘴了，選一顆牙！';$('detail').textContent='24 顆牙裡，藏著 1 顆危險牙。';$('counter').textContent='剩餘 24 顆 · 已按 0 顆'}$('restart').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=`♪ 音效：${sound?'開':'關'}`;$('sound').setAttribute('aria-pressed',String(sound));if(sound)tone(false)};$('rules').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();reset()})();
</script></body></html>
