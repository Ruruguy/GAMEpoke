<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遊戲轉蛋機 · GAMEPOKE!</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f7f1e8;color:#70564d;font:15px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:23px 28px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:29px;margin:7px 0}h2{font-size:19px;margin:0 0 8px}button,input{font:inherit;color:inherit}button{cursor:pointer;border:3px solid #785c4e;border-radius:18px;background:#f9d278;padding:10px 16px;font-weight:800;box-shadow:0 4px #d3b68a}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #4789b3;outline-offset:3px}input{border:2px solid #d4bea1;border-radius:10px;background:#fffaf0;padding:8px;min-width:0}.tools{display:flex;gap:9px}.tools button{font-size:12px;background:#fff9ec}.hint{font-size:12px;color:#a1846b;line-height:1.8}.layout{display:grid;grid-template-columns:250px minmax(340px,1fr) 230px;gap:20px;margin-top:22px;align-items:start}.panel,.game{border:3px solid #785c4e;border-radius:24px;background:#fffaf0;padding:20px;box-shadow:4px 6px #dfcbb1}.game{text-align:center;background:#f8e5b7;position:relative;overflow:hidden}.game h2{font-size:27px}.items{max-height:400px;overflow:auto;margin:16px 0}.item-row{display:flex;gap:6px;align-items:center;margin:9px 0}.item-row input{width:100%;font-size:13px;font-weight:700}.swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1px solid #785c4e}.remove{padding:4px 9px;box-shadow:none;border-width:2px;background:#f5e7d3}.add{width:100%;border-style:dashed;background:#fff0c6;font-size:12px}.check{display:flex;gap:8px;align-items:center;font-size:12px;margin:18px 0}.check input{width:17px;height:17px}.stage{height:440px;display:flex;justify-content:center;align-items:center;position:relative}.halo{position:absolute;width:330px;height:330px;border-radius:50%;background:#fff2cf;border:2px dashed #e2bd80}.machine{width:310px;height:370px;position:relative;transform:scale(var(--scale,1));transform-origin:center}.dome{position:absolute;top:8px;left:10px;width:290px;height:260px;border:6px solid #785c4e;border-radius:45% 45% 35% 35%;background:radial-gradient(circle at 25% 20%,#fffef1,#e7e5d3aa);overflow:hidden;z-index:2;box-shadow:inset 0 0 0 6px #fff9e8}.dome:after{content:'';position:absolute;left:22px;top:22px;width:35px;height:94px;background:#ffffff80;border-radius:70%;transform:rotate(20deg)}.cap{position:absolute;top:0;left:35px;width:240px;height:30px;border:5px solid #785c4e;border-radius:22px 22px 7px 7px;background:#dd8068;z-index:3}.base{position:absolute;bottom:0;left:18px;width:274px;height:154px;border:6px solid #785c4e;border-radius:18px 18px 24px 24px;background:#df8269;box-shadow:inset 9px 0 #f5ad8b,inset -9px 0 #bb634f;z-index:3}.nameplate{margin:12px 0 0;color:#fff1cb;letter-spacing:2px;font-size:11px;font-weight:900}.knob{position:absolute;left:35px;top:43px;width:61px;height:61px;background:#f5d080;border:5px solid #785c4e;border-radius:50%;box-shadow:inset 0 -6px #d3ae67}.handle{position:absolute;left:7px;top:21px;width:38px;height:10px;border:2px solid #785c4e;border-radius:8px;background:#fff3c8;transform:rotate(-25deg)}.mixing .handle{animation:turn-handle 1.3s ease-in-out}.slot{position:absolute;right:24px;top:54px;width:106px;height:57px;border:5px solid #785c4e;border-radius:28px 28px 11px 11px;background:#594235}.capsule{background:linear-gradient(160deg,var(--color,#83abc5) 0 49%,#fffaf0 50%);border:3px solid #785c4e;border-radius:50%;box-shadow:inset 4px 5px #fff4,2px 4px #785c4e25}.little{position:absolute;width:43px;height:43px;left:var(--x);top:var(--y);transform:rotate(var(--tilt));}.mixing .little{animation:mix-ball .24s ease-in-out infinite alternate;animation-delay:var(--delay)}.dispensed{position:absolute;left:180px;top:285px;width:43px;height:43px;z-index:4;opacity:0}.dispensing .dispensed{animation:drop-capsule .65s ease-in forwards}.primary{background:#cd6e57;color:#fff8e8;font-size:21px;min-width:250px}.status{font-size:13px;line-height:1.7;min-height:24px;margin:16px 0 4px;color:#977553}.counter{font-size:12px;color:#977b5c;margin:10px 0}.history{max-height:480px;overflow:auto}.entry{font-size:13px;padding:12px 0;border-bottom:1px solid #e6d4b9;overflow-wrap:anywhere}.entry small{display:block;color:#a58e77;font-size:10px;margin-top:5px}.actions{display:flex;gap:9px;margin-top:15px}.actions button{font-size:11px;padding:7px 12px}.result-dialog{border:4px solid #785c4e;border-radius:30px;background:#fff4d5;color:#70564d;width:850px;max-width:94vw;max-height:94dvh;overflow:auto;text-align:center;padding:25px;box-shadow:0 15px 50px #35241933}.result-dialog::backdrop{background:#57413399;backdrop-filter:blur(5px)}.big-capsule{width:160px;height:160px;margin:15px auto;position:relative;animation:reveal-pop .6s ease-out}.big-capsule:after{content:'★';position:absolute;inset:0;display:grid;place-items:center;color:#fff8e3;font-size:52px;text-shadow:0 2px #785c4e55}.result-dialog h2{font-size:clamp(32px,5vw,68px);line-height:1.3;overflow-wrap:anywhere;margin:18px 0 25px;font-weight:900}.result-dialog small{font-size:13px;color:#a38365}.result-dialog button{font-size:17px}.present .layout{display:block}.present .panel{display:none}.present main{padding:12px 20px;max-width:none}.present main>p{display:none}.present .game{height:calc(100dvh - 85px);display:flex;flex-direction:column;align-items:center;justify-content:center}.present .stage{flex:1;min-height:100px;width:100%}.present .game h2{margin:0}.present .primary{flex-shrink:0}.present .status{margin-top:10px}.present .game>.hint{display:none}@keyframes turn-handle{to{transform:rotate(335deg)}}@keyframes mix-ball{to{transform:translate(var(--dx),var(--dy)) rotate(140deg)}}@keyframes drop-capsule{0%{opacity:0;transform:translate(0,-20px) scale(.8)}25%{opacity:1}75%{opacity:1;transform:translate(14px,44px) rotate(150deg)}100%{opacity:1;transform:translate(10px,36px) rotate(180deg)}}@keyframes reveal-pop{from{opacity:0;transform:translateY(30px) scale(.3)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:1050px){.layout{grid-template-columns:220px 1fr}.history-panel{grid-column:1/-1}.history{max-height:220px}}@media(max-width:650px){main{padding:15px 12px}.layout{display:flex;flex-direction:column}.panel,.game{width:100%}.game{order:-1;padding:18px}.stage{height:390px}.result-dialog{padding:20px 15px}.big-capsule{width:125px;height:125px}.result-dialog h2{font-size:36px}.items{max-height:300px}.present .game{height:calc(100dvh - 95px)}}@media(prefers-reduced-motion:reduce){.mixing .handle,.mixing .little,.big-capsule{animation:none}.dispensing .dispensed{animation-duration:.01ms}}
</style><body><main><header><h1>✦ 遊戲轉蛋機</h1><div class="tools"><button id="sound" aria-pressed="true">🔊 音效</button><button id="full">⛶ 全螢幕</button></div></header><p class="hint">最後一場互動，交給轉蛋決定！自訂選項，再一起扭出今天的驚喜。</p><div class="layout"><section class="panel"><h2>✎ 設定轉蛋獎項</h2><p class="hint">一顆轉蛋對應一個選項，每個選項機會相同。可輸入遊戲、獎品或互動任務。</p><div id="items" class="items"></div><button id="add" class="add">＋ 新增獎項</button><label class="check"><input id="noRepeat" type="checkbox">抽過的選項不再出現</label><button id="reset" style="font-size:12px;width:100%">↻ 全部放回・清除紀錄</button></section><section class="game" id="game"><h2>下一個遊戲，扭出來！</h2><p class="hint">轉動旋鈕 → 掉出轉蛋 → 放大揭曉</p><div class="stage" id="stage"><div class="halo"></div><div class="machine"><div class="cap"></div><div id="dome" class="dome"></div><div class="base"><div class="nameplate">★ GAME GACHA ★</div><div class="knob"><div class="handle"></div></div><div class="slot"></div></div><div id="dispensed" class="capsule dispensed"></div></div></div><div id="counter" class="counter"></div><button id="draw" class="primary">扭一顆轉蛋 ↻</button><div id="status" class="status" role="status" aria-live="polite"></div></section><section class="panel history-panel"><h2>轉蛋紀錄</h2><div id="history" class="history"></div><div class="actions"><button id="export">匯出 CSV</button></div></section></div></main><dialog id="resultDialog" class="result-dialog" aria-labelledby="prizeName"><small>✦ 今天的互動遊戲決定了 ✦</small><div id="bigCapsule" class="capsule big-capsule"></div><h2 id="prizeName"></h2><button id="closeResult">收起結果・繼續扭蛋 →</button></dialog><script>
'use strict';const $=id=>document.getElementById(id),KEY='gamepoke-gacha-v1',colors=['#df8f73','#86abc6','#9bb883','#c498b9','#e6bf6c','#99b9b3'];let items=['十點半','二十一點','比大','妞妞','德州撲克','射龍門','大老二','相減','終極密碼'].map((name,i)=>({id:'default-'+i,name})),history=[],used=[],noRepeat=false,busy=false,enabled=true,audio,master;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.items)&&s.items.length<=100&&s.items.every(p=>typeof p.id==='string'&&typeof p.name==='string')&&new Set(s.items.map(p=>p.id)).size===s.items.length&&Array.isArray(s.history)&&s.history.every(p=>typeof p.name==='string'&&typeof p.id==='string'&&typeof p.time==='string')&&Array.isArray(s.used)&&s.used.every(x=>typeof x==='string')){items=s.items;history=s.history;used=s.used;noRepeat=!!s.noRepeat;enabled=s.enabled!==false}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items,history,used,noRepeat,enabled}))}catch(e){$('status').textContent='瀏覽器無法儲存紀錄，可匯出 CSV 保留結果。'}}function remaining(){return items.filter(p=>!noRepeat||!used.includes(p.id))}function random(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
function update(){const n=remaining().length;$('draw').disabled=busy||!n;$('add').disabled=busy||items.length>=100;$('reset').disabled=busy;$('noRepeat').disabled=busy;$('noRepeat').checked=noRepeat;$('export').disabled=!history.length;$('draw').textContent=busy?'轉蛋滾動中…':'扭一顆轉蛋 ↻';$('counter').textContent=`${items.length} 個選項 · ${noRepeat?'剩餘 '+n+' 顆':'每次可重複抽取'} · 已扭 ${history.length} 次`;document.querySelectorAll('[data-item-input],[data-item-remove]').forEach(e=>e.disabled=busy)}
function renderItems(){$('items').replaceChildren();items.forEach((p,i)=>{const row=document.createElement('div');row.className='item-row';const swatch=document.createElement('i');swatch.className='swatch';swatch.style.background=colors[i%colors.length];const input=document.createElement('input');input.value=p.name;input.maxLength=60;input.dataset.itemInput=p.id;input.setAttribute('aria-label','獎項 '+(i+1));input.oninput=()=>{p.name=input.value;save()};const remove=document.createElement('button');remove.className='remove';remove.dataset.itemRemove=p.id;remove.textContent='×';remove.setAttribute('aria-label','刪除獎項 '+(i+1));remove.onclick=()=>{if(busy)return;items=items.filter(x=>x.id!==p.id);renderItems();buildBalls();update();save()};row.append(swatch,input,remove);$('items').append(row)});update()}
function buildBalls(){$('dome').replaceChildren();const pool=remaining();if(!pool.length)return;const n=Math.min(22,pool.length);let placed=0;const rows=[{count:5,y:194,x:21},{count:5,y:156,x:34},{count:5,y:118,x:21},{count:4,y:80,x:44},{count:3,y:42,x:66}];for(const row of rows){const take=Math.min(row.count,n-placed);if(take<=0)break;const start=row.x+(row.count-take)*22;for(let j=0;j<take;j++){const i=placed++,ball=document.createElement('div');ball.className='capsule little';ball.style.setProperty('--color',colors[items.indexOf(pool[Math.floor(i*pool.length/n)])%colors.length]);ball.style.setProperty('--x',(start+j*44)+'px');ball.style.setProperty('--y',(row.y+(j%2)*2)+'px');ball.style.setProperty('--tilt',(i*41%180)+'deg');ball.style.setProperty('--delay',(-i*.023)+'s');ball.style.setProperty('--dx',((i%3-1)*5)+'px');ball.style.setProperty('--dy',(-5-i%3*3)+'px');$('dome').append(ball)}}}

function renderHistory(){$('history').replaceChildren();if(!history.length){$('history').textContent='還沒扭出轉蛋，第一份驚喜等你揭曉。';return}history.slice().reverse().forEach((p,i)=>{const entry=document.createElement('div');entry.className='entry';entry.textContent='#'+(history.length-i)+' · '+p.name;const time=document.createElement('small');time.textContent=new Date(p.time).toLocaleString('zh-TW',{hour12:false});entry.append(time);$('history').append(entry)})}
async function readyAudio(){if(!enabled)return false;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;if(!audio){audio=new A();master=audio.createGain();master.gain.value=.22;master.connect(audio.destination)}if(audio.state==='suspended')await audio.resume();return enabled&&audio.state==='running'}catch(e){return false}}
async function sound(kind){if(!await readyAudio())return;const now=audio.currentTime;function tone(f,offset,d,volume=.25){const o=audio.createOscillator(),g=audio.createGain(),t=now+offset;o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(25,f*.65),t+d);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.onended=()=>{o.disconnect();g.disconnect()};o.start(t);o.stop(t+d)}function clack(offset,frequency=1800,volume=.6,d=.035){const buffer=audio.createBuffer(1,Math.ceil(audio.sampleRate*d),audio.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1)*Math.exp(-i/(audio.sampleRate*.007));const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();source.buffer=buffer;filter.type='bandpass';filter.frequency.value=frequency;filter.Q.value=1.3;gain.gain.value=volume;source.connect(filter);filter.connect(gain);gain.connect(master);source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect()};source.start(now+offset)}if(kind==='turn'){tone(82,0,1.2,.12);for(let i=0;i<19;i++){clack(i*.065,1200+(i%3)*380,.38+(i%4)*.04);tone(110+(i%3)*28,i*.065,.04,.09)}clack(1.22,2100,.65);tone(180,1.23,.08,.18)}else if(kind==='drop'){clack(0,950,.65,.055);tone(140,0,.1,.35);clack(.18,650,.4,.045);tone(95,.18,.07,.22);clack(.3,550,.22,.03)}else [523,659,784,1047].forEach((f,i)=>tone(f,i*.13,i===3?.6:.2))}

$('draw').onclick=async()=>{if(busy||!remaining().length)return;if(items.some(p=>!p.name.trim())){$('status').textContent='請先填寫所有獎項名稱，或刪除空白選項。';return}busy=true;update();const pool=remaining(),winner={...pool[random(pool.length)]},color=colors[items.findIndex(p=>p.id===winner.id)%colors.length],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,ms));try{$('game').classList.remove('dispensing');$('game').classList.add('mixing');$('status').textContent='轉動旋鈕，讓驚喜在裡面滾一滾…';sound('turn');await wait(reduced?20:1300);$('game').classList.remove('mixing');$('dispensed').style.setProperty('--color',color);$('game').classList.add('dispensing');$('status').textContent='轉蛋出來了，準備揭曉！';sound('drop');await wait(reduced?20:650);history.push({...winner,name:winner.name.trim(),time:new Date().toISOString()});if(!used.includes(winner.id))used.push(winner.id);save();renderHistory();buildBalls();$('bigCapsule').style.setProperty('--color',color);$('prizeName').textContent=winner.name.trim();$('resultDialog').showModal();$('closeResult').focus();sound('win');$('status').textContent='這次扭出：'+winner.name.trim()}finally{busy=false;update()}};
$('add').onclick=()=>{if(busy||items.length>=100)return;items.push({id:crypto.randomUUID(),name:'新獎項'});renderItems();buildBalls();save();$('items').lastElementChild.querySelector('input').focus()};$('noRepeat').onchange=()=>{if(busy)return;noRepeat=$('noRepeat').checked;buildBalls();update();save()};$('reset').onclick=()=>{if(busy)return;if(history.length&&!confirm('全部放回會清除轉蛋紀錄，確定繼續？'))return;used=[];history=[];renderHistory();buildBalls();update();save();$('game').classList.remove('dispensing');$('status').textContent='轉蛋全部就位，準備下一場互動！'};$('closeResult').onclick=()=>$('resultDialog').close();$('resultDialog').addEventListener('close',()=>{$('game').classList.remove('dispensing');$('draw').focus()});
function soundLabel(){$('sound').textContent=enabled?'🔊 音效':'🔇 靜音';$('sound').setAttribute('aria-pressed',String(enabled))}$('sound').onclick=()=>{enabled=!enabled;if(master)master.gain.value=enabled?.22:0;soundLabel();save()};$('export').onclick=()=>{const cell=v=>'"'+String(v).replace(/^[=+@\-]/,"'").replaceAll('"','""')+'"';const csv='\uFEFF'+[['順序','獎項','時間'],...history.map((p,i)=>[i+1,p.name,p.time])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='遊戲轉蛋紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('full').onclick=async()=>{if(document.body.classList.contains('present')){document.body.classList.remove('present');$('full').textContent='⛶ 全螢幕';if(document.fullscreenElement)await document.exitFullscreen()}else{document.body.classList.add('present');$('full').textContent='⛶ 退出全螢幕';try{await document.documentElement.requestFullscreen?.()}catch(e){}}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('present');$('full').textContent='⛶ 全螢幕'}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('resultDialog').open){document.body.classList.remove('present');$('full').textContent='⛶ 全螢幕'}});new ResizeObserver(()=>{const stage=$('stage');stage.style.setProperty('--scale',Math.max(.25,Math.min((stage.clientHeight-25)/370,(stage.clientWidth-15)/310,1.8)))}).observe($('stage'));renderItems();renderHistory();buildBalls();soundLabel();update();
</script></body></html>
