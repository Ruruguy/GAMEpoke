</style></head><body><main><header><div><div class="eyebrow">第十四節 · 教官出題</div><h1>危急個案ＯＸ</h1></div><div class="tools"><button id="sound" aria-pressed="false">♫ 開啟音效</button><label for="category">題型</label><select id="category"><option value="all">全部題型</option></select><button id="shuffle">重新洗牌</button><button id="fullscreen">全螢幕</button></div></header><div class="meta"><span id="topic"></span><span id="progress"></span></div><section class="question" id="question" aria-live="polite"></section><p class="ask">這是不是危急個案？</p><section class="answers" aria-label="判斷選項"><div class="answer" id="yes"><span class="symbol">O</span><span class="label">危急個案</span></div><div class="answer" id="no"><span class="symbol">X</span><span class="label">非危急個案</span></div></section><div class="explanation" id="explanation" aria-live="polite">請學員判斷，再由教官公布答案</div><nav class="controls" aria-label="題目控制"><button id="prev">← 上一題</button><button class="reveal" id="reveal">公布答案</button><button id="next">下一題 →</button></nav><p class="footer">依提供教案第十四節整理 · 每輪隨機且不重複 · ← → 切題／空白鍵公布</p></main><script>
const bank=[{"id": "Q001", "category": "生命徵象", "prompt": "傷病患急性意識不清，GCS 為 13 分。", "urgent": true, "explanation": "符合第十四節危急個案條件：急性意識不清，GCS < 14 分。", "source": "第十四節（二）"}, {"id": "Q002", "category": "生命徵象", "prompt": "傷病患呼吸速率為每分鐘 30 次。", "urgent": true, "explanation": "符合第十四節危急個案條件：呼吸每分鐘 30 次以上。", "source": "第十四節（二）"}, {"id": "Q003", "category": "生命徵象", "prompt": "傷病患呼吸速率為每分鐘 8 次。", "urgent": true, "explanation": "符合第十四節危急個案條件：呼吸每分鐘 < 10 次。", "source": "第十四節（二）"}, {"id": "Q004", "category": "生命徵象", "prompt": "傷病患脈搏為每分鐘 160 次。", "urgent": true, "explanation": "符合第十四節危急個案條件：脈搏每分鐘 > 150 次。", "source": "第十四節（二）"}, {"id": "Q005", "category": "生命徵象", "prompt": "傷病患脈搏為每分鐘 45 次。", "urgent": true, "explanation": "符合第十四節危急個案條件：脈搏每分鐘 < 50 次。", "source": "第十四節（二）"}, {"id": "Q006", "category": "生命徵象", "prompt": "傷病患收縮壓為 230 mmHg。", "urgent": true, "explanation": "符合第十四節危急個案條件：收縮壓 > 220 mmHg。", "source": "第十四節（二）"}, {"id": "Q007", "category": "生命徵象", "prompt": "傷病患收縮壓為 85 mmHg。", "urgent": true, "explanation": "符合第十四節危急個案條件：收縮壓 < 90 mmHg。", "source": "第十四節（二）"}, {"id": "Q008", "category": "生命徵象", "prompt": "傷病患微血管充填時間為 3 秒。", "urgent": true, "explanation": "符合第十四節危急個案條件：微血管充填時間 > 2 秒。", "source": "第十四節（二）"}, {"id": "Q009", "category": "生命徵象", "prompt": "傷病患體溫為 41.5°C。", "urgent": true, "explanation": "符合第十四節危急個案條件：體溫 > 41°C。", "source": "第十四節（二）"}, {"id": "Q010", "category": "生命徵象", "prompt": "傷病患體溫為 31°C。", "urgent": true, "explanation": "符合第十四節危急個案條件：體溫 < 32°C。", "source": "第十四節（二）"}, {"id": "Q011", "category": "生命徵象", "prompt": "傷病患血氧濃度 SpO₂ 為 88%。", "urgent": true, "explanation": "符合第十四節危急個案條件：SpO₂ < 90%。", "source": "第十四節（二）"}, {"id": "Q012", "category": "外傷部位", "prompt": "傷患二度燙傷面積占體表面積 30%。", "urgent": true, "explanation": "符合第十四節危急個案條件：燙傷體表面積 > 25%。", "source": "第十四節（二）"}, {"id": "Q013", "category": "外傷部位", "prompt": "傷患顏面有二度燙傷。", "urgent": true, "explanation": "符合第十四節危急個案條件：顏面或會陰的二度或三度燙傷。", "source": "第十四節（二）"}, {"id": "Q014", "category": "外傷部位", "prompt": "傷患會陰有三度燙傷。", "ur 件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。高收縮壓門檻是 > 220 mmHg，本題未達該門檻。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q079", "category": "門檻辨識", "prompt": "傷病患收縮壓 91 mmHg。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。低收縮壓門檻是 < 90 mmHg，本題未達該門檻。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q080", "category": "門檻辨識", "prompt": "傷病患微血管充填時間 1 秒。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。危急門檻是 > 2 秒，本題未達門檻。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q081", "category": "門檻辨識", "prompt": "傷病患體溫 38°C。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。教案體溫門檻為 > 41°C 或 < 32°C，單憑本題數值未達該門檻。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q082", "category": "門檻辨識", "prompt": "傷病患 SpO₂ 為 95%。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。教案血氧門檻為 < 90%，95% 未達該門檻。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q083", "category": "門檻辨識", "prompt": "傷病患血糖 100 mg/dL。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題既非血糖 < 60 mg/dL，也非血糖機顯示 high。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q084", "category": "急性與基準狀態", "prompt": "傷病患長期 GCS 為 13 分，照護者確認今天與平日完全相同，沒有新發意識改變。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。教案條件是「急性意識不清，GCS < 14」，不能只看到 13 分就忽略是否急性。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q085", "category": "急性與基準狀態", "prompt": "傷病患長期 GCS 為 12 分，今天仍為 12 分。照護者確認沒有急性變化。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題是已確認的長期基準狀態，並非急性意識不清。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q086", "category": "急性與基準狀態", "prompt": "傷病患平日 GCS 為 10 分，現場評估也是 10 分，照護者確認反應與平日一致。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。GCS < 14 是條件的一部分，仍要辨識本題是否有急性變化。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q087", "category": "急性與基準狀態", "prompt": "傷病患因既有失語無法完整回答，GCS 為 13 分。照護者確認為原有狀態，無新發神經症狀。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題明示原有狀態與無急性變化，不能把無法完整回答直接當成急性意識不清。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q088", "category": "急性與基準狀態", "prompt": "傷病患 GCS 為 14 分，沒有急性意識改變或其他神經異常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。14 分並非 < 14 分，且本題沒有急性意識改變。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q089", "category": "急性與基準狀態", "prompt": "傷病患 GCS 為 15 分，意識清楚、對答正常，只說自己想睡午覺。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。想睡午覺不是急性意識不清；本題評估意識清楚。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q090", "category": "急性與基準狀態", "prompt": "傷病患有原本就存在的單側肢體無力，今天與平常相同，沒有新發症狀，也沒有新外傷。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題明示原有且未改變的功能狀態，並無疑似急性腦中風或外傷後癱瘓。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q091", "category": "急性與基準狀態", "prompt": "傷病患先前打瞌睡，呼喚後立即清醒，GCS 15 分，對答與活動正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。要依現場完整評估，打瞌睡本身不等於急性意識不清。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q092", "category": "一般情境", "prompt": "低速車禍傷患只有手肘表淺擦傷，無穿刺傷、骨折或高能量撞擊，意識清楚、生命徵象正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。車禍這個名稱本身不能決定危急度；本題未呈現教案的危急外傷部位或機轉。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q093", "category": "一般情境", "prompt": "傷病患走路跌倒，只有膝蓋小擦傷，無頭部撞擊或其他外傷，意識與生命徵象正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題是表淺擦傷，沒有教案列出的危急條件。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q094", "category": "一般情境", "prompt": "傷病患說肚子輕微悶痛，評估意識清楚、生命徵象正常，無休克徵象或其他危急條件。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。依本題已提供的完整評估判 X；「肚子痛」本身不保證非危急，必須看伴隨症狀與評估。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q095", "category": "一般情境", "prompt": "傷病患有輕微頭痛，意識清楚、生命徵象正常，無新發神經異常或其他危急條件。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題已排除疑似急性腦中風與其他危急條件，不能單靠「頭痛」兩字判危急。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q096", "category": "一般情境", "prompt": "傷病患手指有小割傷，出血已停止，末端感覺、運動與循環正常，沒有截肢或嚴重撕裂傷。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題沒有危急的外傷條件，不能只因看到血就判危急。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q097", "category": "一般情境", "prompt": "傷病患腳踝輕微扭傷，無骨折或其他外傷，末端脈搏、感覺與運動正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題沒有危急外傷條件或末端循環異常。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q098", "category": "一般情境", "prompt": "傷病患流鼻水、輕微咳嗽，呼吸每分鐘 18 次、SpO₂ 98%，無呼吸窘迫。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。咳嗽本身不是教案危急條件，本題呼吸與血氧未達危急門檻。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q099", "category": "一般情境", "prompt": "成人從 1 公尺高處跌落，只有表淺擦傷，無頭部撞擊、骨折或神經異常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題既未達成人高處墜落門檻，也無其他危急外傷條件。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q100", "category": "一般情境", "prompt": "傷病患只有手背小範圍一度燙傷，無顏面或會陰燙傷，也無電擊、化學性或吸入性燙傷。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。本題未呈現教案列出的危急燙傷條件。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q101", "category": "幽默干擾題", "prompt": "傷病患說：「我爸是議員，你最好快一點！」本人無傷病主訴，意識清楚、生命徵象正常，無暴力或自傷意圖。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。家屬身分不屬於病情危急條件，依傷病患本身的評估判斷。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q102", "category": "幽默干擾題", "prompt": "傷病患說：「我是 VIP，當然要算危急！」評估只有小擦傷，意識清楚、生命徵象正常，無危急外傷條件。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。VIP 身分不改變教案危急度標準。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q103", "category": "幽默干擾題", "prompt": "傷病患說：「我的手機剩 1%，快不行了！」本人無傷病主訴，意識與生命徵象正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。手機電量低不等於傷病患血氧低，也不是病情危急條件。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q104", "category": "幽默干擾題", "prompt": "傷病患說：「我餓到快死了！」實際血糖 100 mg/dL，意識與生命徵象正常，無其他症狀。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。口語誇張不能取代評估，本題沒有低血糖或其他危急條件。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q105", "category": "幽默干擾題", "prompt": "傷病患說：「我的遊戲角色 GCS 只有 3 分！」本人 GCS 15 分，無傷病主訴，生命徵象正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。評估對象是現場傷病患，遊戲角色的數值不算本人的生命徵象。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q106", "category": "幽默干擾題", "prompt": "傷病患說：「我錢包大出血！」指的是購物花太多錢，本人無外傷或出血，生命徵象正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。錢包大出血是比喻，本題沒有實際出血或其他危急條件。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q107", "category": "幽默干擾題", "prompt": "傷病患說：「這場車禍超級嚴重，保險桿都刮花了！」確認只是低速碰撞，本人只有小擦傷，無高能量機轉，意識與生命徵象正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。車輛外觀與誇張描述不能取代傷患評估，本題已確認無危急機轉或傷勢。", "source": "依第十四節（二）條件編寫的教學情境"}, {"id": "Q108", "category": "幽默干擾題", "prompt": "傷病患說：「教官說選 O 都會對，所以我是危急！」本人無傷病主訴，意識與生命徵象正常。其餘評估正常，無其他危急條件。", "urgent": false, "explanation": "X，依本題完整評估為非危急個案。答案要依本題條件判斷，猜題口訣不屬危急判斷依據。", "source": "依第十四節（二）條件編寫的教學情境"}];
const $=id=>document.getElementById(id);
let deck=[],cursor=0,revealed=new Set();
for(const category of [...new Set(bank.map(q=>q.category))]){const option=document.createElement('option');option.value=option.textContent=category;$('category').append(option)}
function shuffled(items){const list=[...items];for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}

let audioCtx=null,soundOn=false,beatTimer=null,beatIndex=0,gameVisible=true;
const voices=new Set();
function stopTension(){clearTimeout(beatTimer);beatTimer=null;for(const node of voices){try{node.stop()}catch{}}voices.clear()}
function tone(hz,duration,volume,type='sine',delay=0){if(!audioCtx||audioCtx.state!=='running')return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime+delay;osc.type=type;osc.frequency.setValueAtTime(hz,t);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(volume,t+.008);gain.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(gain);gain.connect(audioCtx.destination);voices.add(osc);osc.onended=()=>{voices.delete(osc);osc.disconnect();gain.disconnect()};osc.start(t);osc.stop(t+duration+.02)}
function startTension(){stopTension();if(!soundOn||!gameVisible||document.hidden||revealed.has(deck[cursor].id))return;beatIndex=0;const pulse=()=>{if(!soundOn||!gameVisible||document.hidden)return;const stage=Math.min(beatIndex/30,1);tone(105+stage*35,.15,.10,'triangle');tone(620+stage*200,.065,.028,'sine',.08);beatIndex++;beatTimer=setTimeout(pulse,470-stage*220)};pulse()}
async function unlockAudio(){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){$('sound').textContent='瀏覽器不支援音效';return false}try{audioCtx??=new Audio();await audioCtx.resume();return audioCtx.state==='running'}catch{return false}}
function revealSound(){stopTension();if(!soundOn||!gameVisible||document.hidden)return;[523.25,659.25,783.99,1046.5].forEach((hz,i)=>tone(hz,.32,.075,'sine',i*.10))}
$('sound').onclick=async()=>{if(soundOn){soundOn=false;stopTension()}else{soundOn=await unlockAudio();if(soundOn)startTension()}$('sound').textContent=soundOn?'♫ 音效開啟':'♫ 開啟音效';$('sound').setAttribute('aria-pressed',String(soundOn))};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTension();else startTension()});
window.addEventListener('pagehide',stopTension);
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.type!=='gamepoke-visibility')return;gameVisible=event.data.visible===true;if(gameVisible)startTension();else stopTension()});

function reset(){deck=shuffled(bank.filter(q=>$('category').value==='all'||q.category===$('category').value));cursor=0;revealed.clear();render()}
function renderQuestion(q){
 const host=$('question');host.replaceChildren();
 const heading=document.createElement('h2');heading.className='question-number';heading.textContent=`第 ${cursor+1} 題`;host.append(heading);
 const phrase='其餘評估正常，無其他危急條件。';
 const condition=q.prompt.endsWith(phrase)?phrase:'';
 let body=condition?q.prompt.slice(0,-phrase.length):q.prompt;
 let lines=body.split('。').map(s=>s.trim()).filter(Boolean);
 // 短項目保留在同一行，長情境依原有逗號逐行列出。
 lines=lines.flatMap(s=>s.length>38?s.split('，'): [s]);
 const list=document.createElement('ul');for(const line of lines){const item=document.createElement('li');item.textContent=line;list.append(item)}host.append(list);
 if(condition){const note=document.createElement('p');note.className='case-condition';note.textContent=condition;host.append(note)}
}
function render(){const q=deck[cursor],open=revealed.has(q.id);renderQuestion(q);$('topic').textContent=q.category;$('progress').textContent=`第 ${cursor+1} / ${deck.length} 題`;$('prev').disabled=cursor===0;$('next').disabled=cursor===deck.length-1;$('reveal').disabled=open;$('reveal').textContent=open?'答案已公布':'公布答案';$('yes').className='answer'+(open?(q.urgent?' correct':' dim'):'');$('no').className='answer'+(open?(!q.urgent?' correct':' dim'):'');$('explanation').textContent=open?q.explanation:'請學員判斷，再由教官公布答案';startTension()}
function move(step){if(cursor+step<0||cursor+step>=deck.length)return;cursor+=step;render()}
$('reveal').onclick=()=>{revealed.add(deck[cursor].id);render();revealSound()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('category').onchange=reset;$('shuffle').onclick=reset;
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullscreen').textContent='請用瀏覽器全螢幕'}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全螢幕':'全螢幕'});
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.code==='Space'){e.preventDefault();$('reveal').click()}});reset();
</script></body></html>
