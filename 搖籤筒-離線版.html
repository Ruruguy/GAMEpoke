<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搖籤筒 · GAMEPOKE!</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6efe4;color:#674c3f;font-family:ui-rounded,'PingFang TC','Microsoft JhengHei',sans-serif}main{max-width:1060px;margin:auto;padding:26px 20px}h1{text-align:center;font-size:40px;margin:10px}h2{margin-top:0;font-size:23px}.intro{text-align:center;color:#866b56}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.panel{background:#fffaf0;border:3px solid #795a49;border-radius:24px;padding:22px;box-shadow:5px 6px #dfcdb4}button,input{font:inherit}button{cursor:pointer;background:#ffda83;color:#694a37;border:2px solid #83614c;border-radius:12px;padding:12px 20px;font-weight:800;box-shadow:0 3px #bb9268}button:hover:not(:disabled){background:#ffe9b0}button:focus-visible,input:focus-visible{outline:3px solid #216c9b;outline-offset:3px}button:disabled{cursor:default;opacity:.5;box-shadow:none}.primary{background:#cf6a51;color:white;font-size:20px}.primary:hover:not(:disabled){background:#b95340}input{padding:10px;border:2px solid #bea58d;background:white;border-radius:10px;color:#644b40;min-width:0}.quantity{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.quantity input{width:96px}.hint{font-size:13px;line-height:1.7;color:#876b57}.stage{height:350px;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 50% 90%,#e3c295 0 26%,transparent 27%),linear-gradient(#e6f0d4,#fbf1d5);margin:16px 0;isolation:isolate}.spark{position:absolute;top:30px;left:15%;font-size:30px;color:#dfab47}.spark:last-of-type{left:auto;right:15%;top:68px}.tube{position:absolute;bottom:38px;left:calc(50% - 72px);width:144px;height:177px;transform-origin:50% 90%;z-index:2}.tube-body{position:absolute;inset:25px 0 0;border:4px solid #744b39;border-radius:10px 10px 35px 35px;background:repeating-linear-gradient(90deg,#c96c47 0 18px,#bd5c3e 18px 22px);box-shadow:inset -10px 0 #9b493440,5px 7px #73503a26}.tube-body:before{content:'幸運籤';position:absolute;top:28px;left:29px;width:78px;line-height:55px;background:#ffe4a3;border:3px solid #835638;border-radius:50%;text-align:center;font-weight:900;font-size:21px;box-shadow:inset 0 0 0 4px #f8cc72}.tube-body:after{content:'';position:absolute;left:3px;right:3px;bottom:15px;height:10px;border:2px solid #7c5039;border-radius:6px;background:#e6b36d}.rim{position:absolute;top:12px;left:-5px;width:154px;height:29px;border:4px solid #784e38;border-radius:50%;background:#5c3e2e;z-index:1}.rim:after{content:'';position:absolute;left:0;right:0;bottom:-7px;height:15px;border:3px solid #795139;border-top:0;border-radius:0 0 50% 50%;background:#e4b26d}.bundle{position:absolute;top:-54px;left:13px;width:118px;height:100px;z-index:2}.bundle i{position:absolute;bottom:0;width:15px;height:105px;border:2px solid #9b743f;border-radius:6px;background:linear-gradient(#d86b50 0 17%,#f3d293 17%);transform-origin:bottom;transform:rotate(var(--tilt));left:var(--x)}.drawn{position:absolute;left:calc(50% - 24px);top:72px;width:48px;height:185px;border:3px solid #94673e;border-radius:10px;background:linear-gradient(#d5674d 0 17%,#ffe1a0 17%);z-index:3;display:grid;place-items:center;padding:38px 4px 10px;color:#714b32;font-size:22px;font-weight:900;writing-mode:vertical-rl;overflow:hidden;opacity:0;box-shadow:4px 6px #7e5a3720}.shaking .tube{animation:shake .18s ease-in-out 10 alternate}.revealed .drawn{animation:emerge .75s ease-out forwards}.revealed .spark{animation:twinkle .8s ease-in-out 2}.result{min-height:90px;text-align:center;background:#fff0b5;border:2px solid #ce9a51;border-radius:14px;padding:14px;overflow-wrap:anywhere}.result small{display:block;font-size:14px}.result strong{font-size:30px;display:block;margin-top:6px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}.stats{text-align:center;font-weight:800;color:#427852}.names{max-height:440px;overflow:auto;margin-top:14px;padding-right:4px}.name-row{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:7px 0}.name-row label{font-weight:800}.drawn-row{opacity:.65}.history{padding-left:25px;max-height:180px;overflow:auto;line-height:1.9;overflow-wrap:anywhere}.error{min-height:24px;color:#ae3d2d;font-weight:700;margin:8px 0}.empty{font-size:14px;color:#846a57}@keyframes shake{from{transform:translate(-7px,0) rotate(-9deg)}to{transform:translate(7px,-4px) rotate(9deg)}}@keyframes emerge{0%{opacity:0;transform:translateY(120px) rotate(-8deg)}25%{opacity:1}100%{opacity:1;transform:translate(126px,-30px) rotate(12deg)}}@keyframes twinkle{50%{transform:scale(1.3) rotate(15deg)}}@media(max-width:720px){.layout{grid-template-columns:1fr}h1{font-size:32px}.panel{padding:18px}.stage{height:330px}@keyframes emerge{0%{opacity:0;transform:translateY(120px)}25%{opacity:1}100%{opacity:1;transform:translate(92px,-30px) rotate(12deg)}}}@media(prefers-reduced-motion:reduce){.shaking .tube{animation:none}.revealed .drawn{animation-duration:.01ms}.revealed .spark{animation:none}}
</style></head><body><main><h1>搖一搖，好運出籤！</h1><p class="intro">自訂每支籤的名字，抽出今天的幸運答案。</p><div class="layout"><section class="panel"><h2>✦ 幸運籤筒</h2><p id="stats" class="stats"></p><div id="stage" class="stage" aria-hidden="true"><span class="spark">✦</span><span class="spark">✦</span><div class="tube"><div class="rim"></div><div class="bundle"><i style="--x:0px;--tilt:-16deg"></i><i style="--x:20px;--tilt:-9deg"></i><i style="--x:38px;--tilt:-3deg"></i><i style="--x:56px;--tilt:4deg"></i><i style="--x:74px;--tilt:11deg"></i><i style="--x:92px;--tilt:18deg"></i></div><div class="tube-body"></div></div><div id="drawn" class="drawn"></div></div><div class="result" role="status" aria-live="polite"><small id="caption">準備好了嗎？</small><strong id="result">按下搖籤，看看抽到誰！</strong></div><div class="actions"><button id="draw" class="primary">搖一搖，抽籤 →</button><button id="reset">重置籤筒 ⟳</button></div><p class="hint">每支籤機率相同，抽過就不再出現。重置會把全部籤放回，保留你設定的名字。</p><h2>抽籤紀錄</h2><ol id="history" class="history"></ol><p id="empty" class="empty">還沒有抽出的籤。</p></section><section class="panel"><h2>✎ 設定你的籤</h2><div class="quantity"><label for="count">籤的數量</label><input id="count" type="number" min="1" max="1000" step="1" value="10"><button id="generate">產生籤</button></div><p class="hint">輸入 1～1,000。未改名字時，預設為 1 到設定數量；留空也會使用原本編號。重新產生會清除目前名字與抽籤紀錄。</p><p id="error" class="error" role="alert"></p><div id="names" class="names"></div></section></div></main><script>
'use strict';const $=id=>document.getElementById(id);let tickets=[],remaining=[],history=[],busy=false;
function update(){ $('stats').textContent=`共 ${tickets.length} 支籤 · 剩餘 ${remaining.length} 支 · 已抽 ${history.length} 支`;['draw','reset','generate','count'].forEach(id=>$(id).disabled=busy||(id==='draw'&&!remaining.length));document.querySelectorAll('[data-ticket]').forEach(input=>{input.disabled=busy;input.parentElement.classList.toggle('drawn-row',!remaining.includes(Number(input.dataset.ticket)));});$('empty').hidden=history.length>0;}
function renderNames(){ $('names').replaceChildren();tickets.forEach((name,i)=>{const row=document.createElement('div');row.className='name-row';const label=document.createElement('label');label.htmlFor=`ticket-${i}`;label.textContent=`第 ${i+1} 籤`;const input=document.createElement('input');input.id=label.htmlFor;input.dataset.ticket=i;input.maxLength=60;input.value=name;input.placeholder=String(i+1);input.setAttribute('aria-label',`第 ${i+1} 籤名字`);input.oninput=()=>tickets[i]=input.value.trim()||String(i+1);row.append(label,input);$('names').append(row);});}
function reset(){if(busy)return;remaining=tickets.map((_,i)=>i);history=[];$('history').replaceChildren();$('stage').className='stage';$('drawn').textContent='';$('caption').textContent='全部籤已就位';$('result').textContent='按下搖籤，看看抽到誰！';$('error').textContent='';update();}
function generate(){if(busy)return;const count=Number($('count').value);if(!$('count').value.trim()||!Number.isInteger(count)||count<1||count>1000){$('error').textContent='請輸入 1～1,000 的整數。';return;}if((history.length||tickets.some((n,i)=>n!==String(i+1)))&&!confirm('重新產生會清除自訂名字與抽籤紀錄，確定繼續？'))return;tickets=Array.from({length:count},(_,i)=>String(i+1));renderNames();reset();}
function randomIndex(n){const r=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(r);}while(r[0]>=limit);return r[0]%n;}
function draw(){if(busy||!remaining.length)return;busy=true;$('stage').className='stage shaking';$('caption').textContent='籤筒搖動中……';$('result').textContent='好運即將揭曉！';update();const index=remaining.splice(randomIndex(remaining.length),1)[0],name=tickets[index]||String(index+1);setTimeout(()=>{history.push({index,name});$('drawn').textContent=name.length>8?`${index+1} 號`:name;$('stage').className='stage revealed';$('caption').textContent=`抽中第 ${index+1} 籤`;$('result').textContent=name;const item=document.createElement('li');item.textContent=`第 ${index+1} 籤：${name}`;$('history').prepend(item);setTimeout(()=>{busy=false;update();if(!remaining.length)$('caption').textContent='全部籤都已抽完，重置後可以再抽！';},800);},matchMedia('(prefers-reduced-motion: reduce)').matches?100:1800);}
$('generate').onclick=generate;$('reset').onclick=reset;$('draw').onclick=draw;generate();
</script></body></html>
