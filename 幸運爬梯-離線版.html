function newGame(initial=false){if(busy)return;const s=read();if(s.names.length<2||s.names.length>12||s.names.length!==s.prizes.length){$('status').textContent='請填入相同數量的參加者與獎項（2～12 個）。';return}if(!initial&&game&&game.done.size&&!confirm('產生新梯子會清除本輪結果，確定繼續？'))return;save(s);$('levels').value=s.levels;const n=s.names.length,x=Array.from({length:n},(_,i)=>95+i*135),top=80,step=65,bottom=top+(s.levels+1)*step;const rungs=Array.from({length:s.levels},()=>{const edges=[];for(let c=0;c<n-1;c++){if(rand(100)<55){edges.push(c);c++}}return edges});game={...s,x,top,step,bottom,rungs,prizes:shuffle(s.prizes.slice()),width:x.at(-1)+95,height:bottom+90,done:new Set(),labels:[],starts:s.names.map((_,i)=>i),startLabels:[],startDots:[]};restoreStarts();$('results').replaceChildren();$('person').replaceChildren();s.names.forEach((name,i)=>{const option=document.createElement('option');option.value=i;option.textContent=name;$('person').append(option)});render();$('status').textContent='梯子已準備好，選一位參加者出發！';lock(false)}
