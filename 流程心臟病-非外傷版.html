</style></head><body><main><header><div><h1>流程心臟病・非外傷版</h1><div class="subtitle">流程當點數，評估與處置當花色</div></div><button id="full">⛶ 全螢幕</button></header><nav class="sequence" id="sequence" aria-label="流程循環"></nav><section class="stage" id="stage"><div class="panel flow-panel"><div class="caption">這一張報的流程</div><div class="flow" id="flow">準備開始</div></div><div class="panel"><div class="caption">翻出的字卡</div><div class="cardtext" id="card">按「翻字卡」開始</div><div class="number" id="cardNumber"></div></div></section><div class="status" id="status" role="status" aria-live="polite">先讓學員判斷，教官按「公布配對」才揭曉。</div><div class="actions"><button id="restart" hidden>本輪完成・重新洗牌</button><button class="primary" id="flip">翻字卡</button><button id="reveal" disabled>公布配對</button><button class="continue" id="continue" hidden>繼續 → 下一張</button></div><div class="progress" id="progress"></div><details><summary>本輪翻牌紀錄</summary><div class="records"><table><thead><tr><th>次序</th><th>流程</th><th>字卡</th><th>結果</th></tr></thead><tbody id="records"></tbody></table></div></details><div class="bottom"><button id="reset">重新洗牌</button><button id="sound" aria-pressed="false">♫ 開啟音效</button></div><p class="note">僅使用已分類字卡；未使用名單另存於本版資料夾。此循環用於教學遊戲，非臨床處置分支。<br>空白鍵：翻下一張。每張牌皆可由教官按「公布配對」揭曉。離開全螢幕可查看本輪紀錄。</p></main><script>
const data={"name": "非外傷", "flows": ["意識", "A", "B", "C", "輔助檢查"], "labels": {"意識": "意識／主訴"}, "cards": [{"id": "002", "text": "評估意識\n並詢問主訴", "status": "初稿", "category": "意識", "matchFlows": ["意識"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "005", "text": "評估呼吸道\n（A）", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "006", "text": "評估呼吸\n（B）", "status": "初稿", "category": "B", "matchFlows": ["B"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "007", "text": "評估循環\n（C）", "status": "初稿", "category": "C", "matchFlows": ["C"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "011", "text": "輔助檢查", "status": "教官已確認", "category": "輔助檢查", "matchFlows": ["輔助檢查"], "candidate": null, "note": "依教官提供的分類／教科書內容。", "gameIncluded": true}, {"id": "028", "text": "下顎推舉法", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "029", "text": "壓額抬下顎法", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "030", "text": "口咽部抽吸", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "031", "text": "呼吸道抽吸", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "032", "text": "哈姆立克法", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "033", "text": "清除呼吸道異物", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "035", "text": "口咽\n（OPA）", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "036", "text": "鼻咽\n（NPA）", "status": "初稿", "category": "A", "matchFlows": ["A"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "037", "text": "聲門上呼吸道\n（SG  "matchFlows": ["B"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "081", "text": "檢查兩側橈動脈搏", "status": "初稿", "category": "C", "matchFlows": ["C"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "082", "text": "膚色是否\n蒼白發紺或異常", "status": "初稿", "category": "C", "matchFlows": ["C"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "083", "text": "末端肢體是否濕冷", "status": "初稿", "category": "C", "matchFlows": ["C"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "084", "text": "微血管充填時間\n是否大於 2 秒", "status": "初稿", "category": "C", "matchFlows": ["C"], "candidate": null, "note": "", "gameIncluded": true}, {"id": "095", "text": "量測血壓、脈搏、血氧濃度", "status": "教官已確認", "category": "輔助檢查", "matchFlows": ["輔助檢查"], "candidate": null, "note": "依教官提供的分類／教科書內容。", "gameIncluded": true, "originalText": "血壓、脈搏\n血氧濃度"}, {"id": "096", "text": "量測體溫", "status": "教官已確認", "category": "輔助檢查", "matchFlows": ["輔助檢查"], "candidate": null, "note": "依教官提供的分類／教科書內容。", "gameIncluded": true}, {"id": "097", "text": "量測血糖", "status": "教官已確認", "category": "輔助檢查", "matchFlows": ["輔助檢查"], "candidate": null, "note": "教官確認：包含原054血糖檢測，兩版只出一張。", "gameIncluded": true, "mergedFrom": ["054"]}, {"id": "099", "text": "疼痛評估", "status": "教官已確認", "category": "輔助檢查", "matchFlows": ["輔助檢查"], "candidate": null, "note": "依教官提供的分類／教科書內容。", "gameIncluded": true}, {"id": "100", "text": "特殊急症相關檢查", "status": "教官已確認", "category": "輔助檢查", "matchFlows": ["輔助檢查"], "candidate": null, "note": "依教官提供的分類／教科書內容。", "gameIncluded": true}, {"id": "101", "text": "重點式身體檢查", "status": "教官已確認", "category": "輔助檢查", "matchFlows": ["輔助檢查"], "candidate": null, "note": "依教官提供的分類／教科書內容。", "gameIncluded": true}]};
const $=id=>document.getElementById(id);let deck=[],step=0,history=[],audio=null,sound=false;
function shuffle(cards){const a=[...cards];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function label(flow){return data.labels[flow]||flow}
function navigation(active){$('sequence').replaceChildren();for(const flow of data.flows){const span=document.createElement('span');span.textContent=label(flow);span.className=flow===active?'active':'';if(flow===active)span.setAttribute('aria-current','step');$('sequence').append(span)}}
function controls(){const ended=step>=deck.length,current=history.at(-1),opened=!!current?.revealed;$('restart').hidden=!ended;$('flip').hidden=opened||ended;$('continue').hidden=!opened||ended;$('flip').disabled=ended;$('continue').disabled=ended;$('reveal').disabled=!current||opened;$('reveal').textContent=opened?'配對已公布':'公布配對';$('flip').textContent=step?'翻下一張':'翻字卡';$('continue').textContent='繼續 → 下一張';$('progress').textContent=`已翻 ${step} / ${deck.length} 張 · 已公布 ${history.filter(r=>r.revealed).length} 張`}
function tone(match){if(!sound||!audio||audio.state!=='running')return;const notes=match?[523,659,784]:[260];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.08;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.07,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(audio.destination);o.onended=()=>{o.disconnect();g.disconnect()};o.start(t);o.stop(t+.22)})}
function renderRecords(){$('records').replaceChildren();history.slice().reverse().forEach((r,i)=>{const row=document.createElement('tr');for(const text of [history.length-i,label(r.flow),r.card.text,r.revealed?(r.match?'配對成功':'未配對'):'未公布']){const td=document.createElement('td');td.textContent=text;row.append(td)}$('records').append(row)})}
function flip(){if(step>=deck.length)return;const flow=data.flows[step%data.flows.length],card=deck[step],match=card.matchFlows.includes(flow);step++;history.push({flow,card,match,revealed:false});$('flow').textContent=label(flow).split('／').join('／\n');$('card').textContent=card.text;$('cardNumber').textContent=`原卡 ${card.id}`;$('stage').className='stage';$('status').className='status';$('status').textContent='請學員判斷並搶答；教官可公布配對，或直接翻下一張。';navigation(flow);renderRecords();controls();tone(false)}
function revealPair(){const r=history.at(-1);if(!r||r.revealed)return;r.revealed=true;$('stage').className='stage'+(r.match?' hit':'');$('status').className='status'+(r.match?' success':'');$('status').textContent=(r.match?'配對成功！':'未配對。')+` 本卡所屬流程：${r.card.matchFlows.map(label).join('／')}`;renderRecords();controls();tone(r.match)}
function reset(){deck=shuffle(data.cards);step=0;history=[];$('flow').textContent='準備開始';$('card').textContent='按「翻字卡」開始';$('cardNumber').textContent='';$('status').textContent='先讓學員判斷，教官按「公布配對」才揭曉。';$('status').className='status';$('stage').className='stage';$('records').replaceChildren();navigation(null);controls()}
$('restart').onclick=()=>{if(confirm('重新洗牌會清除本輪紀錄，確定繼續？'))reset()};$('flip').onclick=flip;$('reveal').onclick=revealPair;$('continue').onclick=flip;$('reset').onclick=()=>{if(step&&!confirm('重新洗牌會清除本輪翻牌紀錄，確定繼續？'))return;reset()};$('sound').onclick=async()=>{if(sound){sound=false}else{try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio??=new A();await audio.resume();sound=audio.state==='running'}catch{sound=false}}$('sound').textContent=sound?'♫ 音效開啟':'♫ 開啟音效';$('sound').setAttribute('aria-pressed',String(sound))};let parentPresentation=false;$('full').onclick=async()=>{if(parentPresentation){window.parent.postMessage({type:'gamepoke-exit-presentation'},'*');return}try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('status').textContent='可使用瀏覽器的全螢幕功能'}};window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.type!=='gamepoke-presentation')return;parentPresentation=e.data.enabled===true;document.body.classList.toggle('present',parentPresentation||!!document.fullscreenElement);$('full').textContent=document.body.classList.contains('present')?'⛶ 退出全螢幕':'⛶ 全螢幕'});document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('present',!!document.fullscreenElement);$('full').textContent=document.fullscreenElement?'⛶ 退出全螢幕':'⛶ 全螢幕'});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','INPUT','SELECT','TEXTAREA','SUMMARY'].includes(e.target.tagName)){e.preventDefault();step>=deck.length?$('restart').click():flip()}});reset();
