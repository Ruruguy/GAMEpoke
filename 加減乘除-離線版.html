<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加減乘除 · GAMEPOKE!</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f7f1e8;color:#70564d;font:16px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:34px;margin:6px 0}h2{font-size:22px;margin:0 0 15px}button,input{font:inherit;color:inherit}button{border:3px solid #785c4e;border-radius:16px;padding:10px 18px;background:#ffda83;font-weight:800;cursor:pointer;box-shadow:0 4px #d2af84}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #4789b3;outline-offset:3px}input{border:2px solid #d0b99b;border-radius:10px;background:#fff;padding:9px;min-width:0}.panel{border:3px solid #785c4e;border-radius:24px;padding:23px;background:#fffaf0;margin-top:22px;box-shadow:5px 6px #dfcbb1}.intro,.note{font-size:13px;line-height:1.8;color:#9c8067}.settings{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.settings input{width:80px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.player-row{display:grid;grid-template-columns:40px 1fr 120px;gap:8px;align-items:center;background:#f6ecda;padding:10px;border-radius:13px}.player-row span{font-weight:800}.player-row input:first-of-type{font-size:19px;font-weight:800;width:100%}.player-row input:last-child{width:100%}.error{color:#b75341;min-height:22px;font-size:13px}.arena{background:#f7e6ba;text-align:center}.rounds{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.round-chip{border:2px solid #d9bc91;border-radius:20px;padding:8px 15px;background:#fff7e5;font-weight:800}.round-chip.active{background:#df8268;color:#fff;border-color:#785c4e}.round-chip.finished{background:#dce8c9}.current{font-size:28px;font-weight:900;margin:22px 0 10px;overflow-wrap:anywhere}.die-wrap{height:215px;display:grid;place-items:center;perspective:600px}.die{width:155px;height:155px;background:linear-gradient(135deg,#fffef4,#f3dfb7);border:5px solid #785c4e;border-radius:26px;box-shadow:8px 10px #c5a27a;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px;padding:22px;transform:rotate(-7deg)}.pip{border-radius:50%;background:#c56a54;opacity:0;box-shadow:inset 0 -2px #9e4b3a}.pip.on{opacity:1}.rolling .die{animation:tumble .22s linear infinite}.primary{font-size:23px;background:#d5745c;color:#fff8ea;min-width:240px}.outcome{font-size:22px;min-height:36px;margin-top:20px;font-weight:800}.outcome.small{font-size:17px}.scoreboard{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:15px 12px;text-align:center;border-bottom:1px solid #e3d2bb}th{background:#f3e5c8;color:#987254;font-size:13px}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fffaf0;min-width:140px}td:first-child{font-size:23px;font-weight:900}td:nth-child(2){font-size:24px;font-weight:900;color:#416e98}.detail{font-size:11px;color:#a48b73;display:block;margin-top:4px}.active-player td{background:#fff0be}.winner td{background:#edf3df}.winner td:first-child{background:#fff0be;color:#a3632d}.crown{display:block;font-size:30px}.history{line-height:1.9;max-height:210px;overflow:auto;font-size:13px}.tools{display:flex;gap:8px}.tools button{font-size:12px}.present main{max-width:none;padding:12px 20px}.present #setup,.present .intro,.present .note{display:none}.present .panel{margin-top:12px}.present .die-wrap{height:185px}.present .current{margin:15px 0 4px}@keyframes tumble{0%{transform:rotate(-12deg) rotateY(0)}50%{transform:translateY(-12px) rotate(12deg) rotateY(30deg)}100%{transform:rotate(-12deg) rotateY(0)}}@media(max-width:700px){main{padding:15px 12px}h1{font-size:28px}.panel{padding:16px}.players{grid-template-columns:1fr}.player-row{grid-template-columns:30px 1fr 100px}.current{font-size:23px}.round-chip{font-size:12px;padding:7px 10px}td:first-child{font-size:20px}.die{width:140px;height:140px;gap:10px;padding:20px}.primary{font-size:20px}.outcome{font-size:18px}}@media(prefers-reduced-motion:reduce){.rolling .die{animation:none}}
</style><body><main><header><h1>🎲 加減乘除</h1><div class="tools"><button id="sound" aria-pressed="true">🔊 音效</button><button id="full">⛶ 全螢幕</button><button id="reset">重新設定</button></div></header><p class="intro">一顆骰子，四局變化。從加分到除法，誰能把籌碼留到最後？</p><section class="panel" id="setup"><h2>設定參賽玩家</h2><div class="settings"><label for="count">玩家數量</label><input id="count" type="number" min="1" max="30" value="4"><button id="resize">更新玩家</button></div><div id="players" class="players"></div><button id="start" class="primary">開始四局挑戰 →</button><p id="error" class="error" role="alert"></p></section><section class="panel arena"><div id="rounds" class="rounds"></div><div id="current" class="current">設定玩家，準備出發！</div><div class="die-wrap" id="dieWrap"><div id="die" class="die" role="img" aria-label="骰子 1 點"></div></div><button id="roll" class="primary" disabled>骰加 ＋</button><div id="outcome" class="outcome" role="status" aria-live="polite"></div></section><section class="panel"><h2>🏆 四局總表</h2><div id="scoreboard" class="scoreboard"></div><p class="note">每局開始以當下分數由高至低排列，同分依原始列表順序。各玩家每局擲一次六面骰，依序加、減、乘、除骰出點數。除法四捨五入至兩位小數；負分仍可參賽。</p><h2 style="margin-top:24px">擲骰紀錄</h2><div id="history" class="history">還沒有擲骰紀錄。</div></section></main><script>
'use strict';const $=id=>document.getElementById(id),OPS=[{name:'加',symbol:'＋'},{name:'減',symbol:'−'},{name:'乘',symbol:'×'},{name:'除',symbol:'÷'}],spots={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};let configs=[],players=[],round=0,order=[],turn=0,busy=false,started=false,finished=false,records=[],sound=true,audio;
const fmt=n=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});function drawDie(n){$('die').replaceChildren();for(let i=0;i<9;i++){const p=document.createElement('span');p.className='pip'+(spots[n].includes(i)?' on':'');$('die').append(p)}$('die').setAttribute('aria-label',`骰子 ${n} 點`)}
function randomDie(){const a=new Uint32Array(1),limit=Math.floor(4294967296/6)*6;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%6+1}
function collect(){return [...$('players').children].map(row=>({name:row.children[1].value,score:row.children[2].value}))}function configure(){if(started||busy)return;const n=Number($('count').value);if(!Number.isInteger(n)||n<1||n>30){$('error').textContent='玩家數量請填 1～30 的整數。';return}const old=collect();configs=Array.from({length:n},(_,i)=>old[i]||{name:`玩家 ${i+1}`,score:'1000'});$('players').replaceChildren();configs.forEach((p,i)=>{const row=document.createElement('div');row.className='player-row';const no=document.createElement('span');no.textContent=i+1;const name=document.createElement('input');name.value=p.name;name.maxLength=30;name.setAttribute('aria-label',`玩家 ${i+1} 名稱`);const score=document.createElement('input');score.type='number';score.step='.01';score.value=p.score;score.setAttribute('aria-label',`玩家 ${i+1} 初始籌碼`);row.append(no,name,score);$('players').append(row)});$('error').textContent=''}
function rankRound(){order=players.map((_,i)=>i).sort((a,b)=>players[b].score-players[a].score||a-b);turn=0}function update(){const best=players.length?Math.max(...players.map(p=>p.score)):null;$('rounds').replaceChildren();OPS.forEach((op,i)=>{const e=document.createElement('span');e.className='round-chip'+(started&&i===round&&!finished?' active':started&&(i<round||finished)?' finished':'');e.textContent=`第 ${i+1} 局 · ${op.symbol} ${op.name}`;$('rounds').append(e)});$('roll').disabled=!started||busy||finished;$('reset').disabled=busy;$('roll').textContent=finished?'四局完成':`${busy?'擲骰中…':'骰'+OPS[round].name+' '+OPS[round].symbol}`;$('current').textContent=finished?'👑 優勝者：'+players.filter(p=>p.score===best).map(p=>p.name).join('、'):started?`第 ${round+1} / 4 局 · ${players[order[turn]].name}`:'設定玩家，準備出發！';const table=document.createElement('table'),head=table.createTHead().insertRow();['玩家','目前籌碼',...OPS.map((op,i)=>`第 ${i+1} 局 ${op.symbol}`)].forEach(s=>{const th=document.createElement('th');th.textContent=s;head.append(th)});const body=table.createTBody();players.forEach((p,i)=>{const row=body.insertRow();row.className=finished&&p.score===best?'winner':started&&!finished&&order[turn]===i?'active-player':'';const name=row.insertCell();if(finished&&p.score===best){const crown=document.createElement('span');crown.className='crown';crown.textContent='👑';crown.setAttribute('aria-label','優勝者');name.append(crown)}name.append(document.createTextNode(p.name));row.insertCell().textContent=fmt(p.score);OPS.forEach((op,j)=>{const cell=row.insertCell(),r=p.results[j];if(!r){cell.textContent='—';return}cell.append(document.createTextNode(op.symbol+' '+r.die));const detail=document.createElement('small');detail.className='detail';detail.textContent=fmt(r.before)+' → '+fmt(r.after);cell.append(detail)})});$('scoreboard').replaceChildren(table)}
function calculate(score,op,die){const value=op===0?score+die:op===1?score-die:op===2?score*die:score/die;return Math.round((value+Math.sign(value)*Number.EPSILON)*100)/100}
function start(){if(busy||started)return;const n=Number($('count').value),rows=collect();if(n!==rows.length||!Number.isInteger(n)||n<1||n>30){$('error').textContent='請先更新玩家數量。';return}if(rows.some(p=>!String(p.score).trim()||!Number.isFinite(Number(p.score))||Math.abs(Number(p.score))>1000000000||!Number.isSafeInteger(Math.round(Number(p.score)*100)))){$('error').textContent='初始籌碼請填有效數字，介於 −10 億至 10 億。';return}players=rows.map((p,i)=>({name:p.name.trim()||`玩家 ${i+1}`,score:calculate(Number(p.score),0,0),results:Array(4).fill(null)}));round=0;records=[];finished=false;started=true;rankRound();$('setup').hidden=true;$('history').textContent='還沒有擲骰紀錄。';$('outcome').textContent='先從最高分玩家開始！';update()}
async function readyAudio(){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio??=new A();if(audio.state==='suspended')await audio.resume()}catch(e){}}
function tone(f,t,d=.1){if(!sound||!audio||audio.state!=='running')return;try{const o=audio.createOscillator(),g=audio.createGain(),at=audio.currentTime+t;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,at);g.gain.linearRampToValueAtTime(.1,at+.01);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);g.connect(audio.destination);o.onended=()=>{o.disconnect();g.disconnect()};o.start(at);o.stop(at+d)}catch(e){}}
$('roll').onclick=async()=>{if(!started||busy||finished)return;busy=true;update();readyAudio();const index=order[turn],p=players[index],op=round,before=p.score,die=randomDie(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let timer;try{$('dieWrap').classList.add('rolling');if(!reduced){let tick=0;timer=setInterval(()=>{drawDie(tick++%6+1);tone(180+(tick%3)*90,0,.06)},90)}await new Promise(r=>setTimeout(r,reduced?50:1000));clearInterval(timer);drawDie(die);const after=calculate(before,op,die);p.score=after;p.results[op]={die,before,after};records.push({name:p.name,op,die,before,after});$('history').replaceChildren();records.slice().reverse().forEach((r,i)=>{const line=document.createElement('div');line.textContent=`#${records.length-i} · ${r.name} · ${fmt(r.before)} ${OPS[r.op].symbol} ${r.die} ＝ ${fmt(r.after)}`;$('history').append(line)});$('outcome').textContent=`${p.name}：${fmt(before)} ${OPS[op].symbol} ${die} ＝ ${fmt(after)}`;tone(660,0,.17);turn++;if(turn===order.length){if(round===3){finished=true;[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3))}else{round++;rankRound()}}}finally{clearInterval(timer);$('dieWrap').classList.remove('rolling');busy=false;update()}};
$('start').onclick=start;$('resize').onclick=configure;$('count').onchange=configure;$('reset').onclick=()=>{if(busy)return;if(started&&!confirm('重新設定會清除四局成績，確定繼續？'))return;started=false;finished=false;players=[];records=[];round=0;$('setup').hidden=false;$('outcome').textContent='';$('history').textContent='還沒有擲骰紀錄。';drawDie(1);update()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 音效':'🔇 靜音';$('sound').setAttribute('aria-pressed',String(sound))};$('full').onclick=async()=>{if(document.body.classList.contains('present')){document.body.classList.remove('present');$('full').textContent='⛶ 全螢幕';if(document.fullscreenElement)await document.exitFullscreen()}else{document.body.classList.add('present');$('full').textContent='⛶ 退出全螢幕';try{await document.documentElement.requestFullscreen?.()}catch(e){}}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('present');$('full').textContent='⛶ 全螢幕'}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('present');$('full').textContent='⛶ 全螢幕'}});configure();drawDie(1);update();
</script></body></html>
