<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸運轉盤 · GAMEPOKE!</title><style>
:root{color-scheme:light;font-family:'PingFang TC','Microsoft JhengHei',system-ui,sans-serif;color:#6b5044;background:#f7f1e8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(#dfd0bb 1px,transparent 1px) 0 0/24px 24px}button,input,select{font:inherit}button{cursor:pointer;border:2px solid #8f6c54;border-radius:12px;padding:10px 16px;background:#fff5df;color:#6b5044;font-weight:800;box-shadow:0 3px #d1b89b}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #285caa;outline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 28px}header b{font-size:23px}header div{display:flex;gap:8px}main{max-width:1500px;margin:auto;padding:0 24px 25px}.intro{text-align:center;margin-bottom:24px}.intro h1{font-size:30px;margin:6px}.intro p{font-size:13px;color:#8b705a}.layout{display:grid;grid-template-columns:420px minmax(0,1fr);gap:22px;align-items:start}.panel{background:#fffaf0;border:3px solid #795b4a;border-radius:22px;padding:20px;box-shadow:4px 5px #d7c3a8}h2{font-size:18px;margin:0 0 12px}.help{font-size:12px;color:#8c725d;line-height:1.8}.settings-top{display:grid;gap:10px;margin-bottom:15px}input,select{color:#654b3f;background:#fffdf6;border:2px solid #baa082;border-radius:9px;padding:8px;min-width:0}input[type=color]{width:44px;height:41px;padding:3px}.item{background:#f3ead9;border:1px solid #dcc8ac;border-radius:13px;padding:11px;margin-bottom:10px}.item-title{display:flex;gap:8px;align-items:center}.item-title input[type=text]{flex:1;width:100px;font-weight:700}.remove{padding:6px 10px;color:#ae4f3f;background:#fff3e7;box-shadow:none}.weights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}.weights label{font-size:11px;line-height:1.7}.weights input{width:100%;font-size:14px}.prob{display:block;color:#20538c;font-size:11px;font-weight:bold;margin-top:6px}.add{width:100%;border-style:dashed;background:#fffdf5;margin-bottom:12px}.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.presets button{font-size:12px;padding:8px 10px}.arena{text-align:center;background:#f9edce}.result{background:#fffdf5;border:2px solid #c29b68;border-radius:18px;padding:14px;min-height:92px;margin-bottom:15px}.result small{font-size:11px;color:#9a7857}.result strong{display:block;font-size:27px;color:#ad4d37;margin-top:6px;overflow-wrap:anywhere}.wheel-stage{position:relative;width:min(100%,650px);margin:0 auto;padding-top:25px}.pointer{position:absolute;top:4px;left:calc(50% - 20px);width:40px;height:52px;background:#f34862;clip-path:polygon(0 0,100% 0,50% 100%);z-index:3;filter:drop-shadow(0 3px 0 #934f3f)}canvas{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 0 #b99a75);transition:transform 4.8s cubic-bezier(.12,.65,.12,1)}.hub{position:absolute;left:50%;top:calc(50% + 12px);transform:translate(-50%,-50%);border-radius:50%;width:23%;aspect-ratio:1;background:#fffdf6;border:4px solid #785b49;color:#d4644a;font-size:38px;box-shadow:0 4px 8px #6b504433;display:grid;place-items:center;padding:0}.spin{background:#d86e55;color:#fffaf1;border-color:#91503c;font-size:20px;padding:15px 35px;min-width:220px;margin:22px auto 8px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.history{margin-top:20px;text-align:left}.history ol{padding-left:25px;max-height:220px;overflow:auto;font-size:14px;line-height:2}.notice{min-height:20px;color:#a34b35;font-size:12px;margin-top:9px}.arena .help{margin:8px 0}.settings-title{display:flex;justify-content:space-between;align-items:center}#title{width:100%}.error{border-color:#bb392e}.title-label{font-size:12px;font-weight:bold}.mode{font-size:12px}.mode select{width:100%;margin-top:5px}@media(max-width:1000px){.layout{grid-template-columns:340px minmax(0,1fr)}.panel{padding:15px}.result strong{font-size:22px}}@media(max-width:760px){header{padding:15px;flex-wrap:wrap}header b{font-size:20px}main{padding:0 12px 20px}.layout{display:flex;flex-direction:column}.arena{order:-1;width:100%}.settings{width:100%}.wheel-stage{max-width:500px}.hub{font-size:28px}.intro{margin-bottom:15px}.intro h1{font-size:25px}header button{font-size:11px;padding:8px 10px}}@media(prefers-reduced-motion:reduce){canvas{transition-duration:.2s}}
</style></head><body><header><b>✦ 幸運轉盤</b><div><button id="toggle">⚙ 顯示／隱藏設定</button><button id="sound" aria-pressed="false">♪ 音效：關</button></div></header><main><section class="intro"><h1 id="heading">德州撲克轉盤</h1><p>把驚喜放進轉盤，轉出今天的下一步！</p></section><div class="layout"><section id="settings" class="panel settings"><h2>✎ 轉盤設定</h2><div class="settings-top"><label class="title-label">轉盤名稱<input id="title" maxlength="60" value="德州撲克轉盤"></label><label class="mode">抽中機率<select id="mode"><option value="linked">跟隨扇區比例</option><option value="independent">獨立設定機率權重</option></select></label></div><p class="help">比例與機率使用相對權重，例如 1、2、1 代表 25%、50%、25%。比例控制扇區大小；獨立機率模式可另外控制抽中機會。機率權重 0 代表不會抽中。</p><div id="items"></div><button id="add" class="add">＋ 新增轉盤項目</button><div id="validation" class="notice" role="status"></div><div class="presets"><button id="equal">全部等比例</button><button id="preset">載入範例</button><button id="export">匯出設定</button><button id="import">匯入設定</button><input id="file" type="file" accept="application/json,.json" hidden></div><p class="help">設定與紀錄會自動保存在此瀏覽器（若瀏覽器允許）。旋轉中會鎖定設定，避免結果與指針不一致。</p></section><section class="panel arena"><div class="result" aria-live="polite"><small id="resultHint">準備好了嗎？</small><strong id="result">按下開始，讓轉盤決定！</strong></div><div class="wheel-stage"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="900" height="900" role="img" aria-label="彩色幸運轉盤"></canvas><button id="hub" class="hub" aria-label="開始旋轉">▶</button></div><button id="spin" class="spin">開始旋轉 →</button><p id="modeHint" class="help">扇區比例等於抽中機率</p><section class="history"><div class="settings-title"><h2>🏆 轉盤紀錄</h2><button id="clear">清除紀錄</button></div><ol id="history"><li>還沒有結果，轉出第一份驚喜！</li></ol></section></section></div></main><script>
'use strict';const $=id=>document.getElementById(id);const defaults=()=>[{text:'手牌隨機一張交換',color:'#08b9db',size:2,chance:2},{text:'手牌自選一張交換',color:'#1763ed',size:2,chance:2},{text:'公牌隨機換一張',color:'#ff7911',size:2,chance:2},{text:'沒事',color:'#9439bd',size:1,chance:1},{text:'手牌多一張',color:'#55b87e',size:2,chance:2},{text:'公牌多一張',color:'#ed7481',size:2,chance:2},{text:'公牌多兩張',color:'#f6dc63',size:2,chance:2}];let items=defaults(),history=[],angle=0,spinning=false,sound=false,audio=null;const storageKey='gamepoke-wheel-v1';
function save(){try{localStorage.setItem(storageKey,JSON.stringify({items,history,title:$('title').value,mode:$('mode').value}));}catch{}}
function validItems(v){return Array.isArray(v)&&v.length>=2&&v.length<=30&&v.every(x=>x&&typeof x.text==='string'&&x.text.trim()&&x.text.length<=80&&/^#[0-9a-f]{6}$/i.test(x.color)&&Number.isFinite(x.size)&&x.size>0&&x.size<=1000000&&Number.isFinite(x.chance)&&x.chance>=0&&x.chance<=1000000);}
function weights(){return items.map(x=>$('mode').value==='linked'?x.size:x.chance);}function isValid(){return validItems(items)&&weights().reduce((a,b)=>a+b,0)>0;}
function renderSettings(){const list=$('items');list.replaceChildren();items.forEach((item,i)=>{const row=document.createElement('div');row.className='item';const top=document.createElement('div');top.className='item-title';const color=document.createElement('input');color.type='color';color.value=item.color;color.setAttribute('aria-label',`項目 ${i+1} 顏色`);const text=document.createElement('input');text.type='text';text.value=item.text;text.maxLength=80;text.setAttribute('aria-label',`項目 ${i+1} 內容`);const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',`刪除項目 ${i+1}`);remove.disabled=items.length<=2;remove.onclick=()=>{items.splice(i,1);resetAngle();renderSettings();refresh();};top.append(color,text,remove);const w=document.createElement('div');w.className='weights';[['扇區比例權重','size'],['抽中機率權重','chance']].forEach(([label,key])=>{const lab=document.createElement('label');lab.textContent=label;const input=document.createElement('input');input.type='number';input.min=key==='size'?'0.01':'0';input.max='1000000';input.step='any';input.value=item[key];input.setAttribute('aria-label',`項目 ${i+1} ${label}`);input.dataset.key=key;input.oninput=()=>{item[key]=input.value.trim()?Number(input.value):NaN;resetAngle();refresh();};lab.append(input);w.append(lab);});const p=document.createElement('span');p.className='prob';p.id='prob-'+i;row.append(top,w,p);list.append(row);text.oninput=()=>{item.text=text.value;refresh();};color.oninput=()=>{item.color=color.value;refresh();};});}
function resetAngle(){angle=0;$('wheel').style.transition='none';$('wheel').style.transform='rotate(0deg)';}
function refresh(){const good=isValid(),sum=items.reduce((a,x)=>a+x.size,0),ws=weights(),total=ws.reduce((a,x)=>a+x,0);$('heading').textContent=$('title').value.trim()||'幸運轉盤';$('spin').disabled=$('hub').disabled=!good||spinning;$('add').disabled=items.length>=30||spinning;$('validation').textContent=good?'': '請填寫至少 2 項內容；比例須大於 0，機率權重不可為負數且總和須大於 0。';items.forEach((x,i)=>{const p=$('prob-'+i);if(p)p.textContent=good?`扇區 ${(x.size/sum*100).toFixed(1)}% · 抽中 ${(ws[i]/total*100).toFixed(1)}%`:'請檢查設定';});document.querySelectorAll('[data-key="chance"]').forEach(input=>input.disabled=spinning||$('mode').value==='linked');$('modeHint').textContent=$('mode').value==='linked'?'扇區比例等於抽中機率':'獨立機率模式：扇區大小與抽中機會可不同';draw();if(good)save();}
function draw(){const canvas=$('wheel'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,900,900);if(!validItems(items))return;const total=items.reduce((a,x)=>a+x.size,0);let start=-Math.PI/2;items.forEach(item=>{const extent=item.size/total*Math.PI*2;ctx.beginPath();ctx.moveTo(450,450);ctx.arc(450,450,420,start,start+extent);ctx.closePath();ctx.fillStyle=item.color;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff9ed';ctx.stroke();const mid=start+extent/2;ctx.save();ctx.translate(450+Math.cos(mid)*280,450+Math.sin(mid)*280);ctx.rotate(mid+Math.PI/2);let font=Math.max(10,Math.min(27,extent*130));ctx.font=`800 ${font}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const text=item.text;while(ctx.measureText(text).width>Math.min(220,extent*280)&&font>9){font--;ctx.font=`800 ${font}px sans-serif`;}ctx.lineWidth=4;ctx.strokeStyle='#44372b';ctx.strokeText(text,0,0);ctx.fillStyle='#fffdf4';ctx.fillText(text,0,0);ctx.restore();start+=extent;});ctx.beginPath();ctx.arc(450,450,421,0,Math.PI*2);ctx.strokeStyle='#795b4a';ctx.lineWidth=8;ctx.stroke();canvas.setAttribute('aria-label',items.map((x,i)=>`${x.text}，抽中機率 ${(weights()[i]/weights().reduce((a,b)=>a+b,0)*100).toFixed(1)}%`).join('；'));}
function random(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}function pick(ws,r){const total=ws.reduce((a,b)=>a+b,0);let t=r*total;for(let i=0;i<ws.length;i++){if(t<ws[i])return i;t-=ws[i];}return ws.findLastIndex(w=>w>0);}
function beep(freq,duration=.09){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch{}}
function lock(on){$('settings').querySelectorAll('input,select,button').forEach(el=>el.disabled=on);$('clear').disabled=on;$('spin').disabled=$('hub').disabled=on;if(!on){renderSettings();refresh();}}
function spin(){if(spinning||!isValid())return;spinning=true;lock(true);const ws=weights(),chosen=pick(ws,random()),total=items.reduce((a,x)=>a+x.size,0),before=items.slice(0,chosen).reduce((a,x)=>a+x.size,0);const position=(before+items[chosen].size*(.25+random()*.5))/total*360;const target=(360-position)%360;const delta=(target-angle%360+360)%360;angle+=360*6+delta;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const duration=reduced?250:4800;$('wheel').style.transition=`transform ${duration}ms cubic-bezier(.12,.65,.12,1)`;$('resultHint').textContent='轉盤旋轉中……';$('result').textContent='下一個驚喜會是什麼？';requestAnimationFrame(()=>requestAnimationFrame(()=>$('wheel').style.transform=`rotate(${angle}deg)`));let tick=0;const ticker=setInterval(()=>beep(450+(tick++%3)*90),160);setTimeout(()=>{clearInterval(ticker);spinning=false;$('resultHint').textContent='這次轉到了';$('result').textContent=items[chosen].text;history.unshift({text:items[chosen].text,time:new Date().toLocaleString('zh-TW'),chance:ws[chosen]/ws.reduce((a,b)=>a+b,0)*100});history=history.slice(0,100);renderHistory();lock(false);save();[523,659,784].forEach((n,i)=>setTimeout(()=>beep(n,.25),i*120));},duration+80);}
function renderHistory(){$('history').replaceChildren();if(!history.length){const li=document.createElement('li');li.textContent='還沒有結果，轉出第一份驚喜！';$('history').append(li);}history.forEach(x=>{const li=document.createElement('li');li.textContent=`${x.text} · ${x.time}（抽中機率 ${x.chance.toFixed(1)}%）`;$('history').append(li);});}
$('spin').onclick=$('hub').onclick=spin;$('title').oninput=refresh;$('mode').onchange=()=>{resetAngle();refresh();};$('add').onclick=()=>{items.push({text:`項目 ${items.length+1}`,color:'#e9ac62',size:1,chance:1});resetAngle();renderSettings();refresh();};$('equal').onclick=()=>{items.forEach(x=>x.size=x.chance=1);resetAngle();renderSettings();refresh();};$('preset').onclick=()=>{if(!confirm('載入範例會取代目前設定，確定繼續？'))return;items=defaults();$('title').value='德州撲克轉盤';$('mode').value='linked';resetAngle();renderSettings();refresh();};$('clear').onclick=()=>{if(history.length&&!confirm('確定清除轉盤紀錄？'))return;history=[];renderHistory();save();};$('toggle').onclick=()=>{$('settings').hidden=!$('settings').hidden;document.querySelector('.layout').style.gridTemplateColumns=$('settings').hidden?'1fr':'';};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=`♪ 音效：${sound?'開':'關'}`;$('sound').setAttribute('aria-pressed',String(sound));beep(660);};$('export').onclick=()=>{if(!isValid()){alert('請先修正設定。');return;}const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,title:$('title').value,mode:$('mode').value,items},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='幸運轉盤設定.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;if(f.size>100000)throw Error();const d=JSON.parse(await f.text());if(!validItems(d.items)||!['linked','independent'].includes(d.mode)||typeof d.title!=='string'||d.title.length>60||(d.mode==='independent'&&d.items.reduce((a,x)=>a+x.chance,0)<=0))throw Error();items=d.items;$('title').value=d.title;$('mode').value=d.mode;resetAngle();renderSettings();refresh();}catch{alert('設定檔格式不正確，未變更現有設定。');}finally{$('file').value='';}};
try{const d=JSON.parse(localStorage.getItem(storageKey));if(d&&validItems(d.items)&&['linked','independent'].includes(d.mode)&&typeof d.title==='string'&&d.title.length<=60&&(d.mode==='linked'||d.items.reduce((a,x)=>a+x.chance,0)>0)){items=d.items;$('title').value=d.title;$('mode').value=d.mode;if(Array.isArray(d.history))history=d.history.filter(x=>x&&typeof x.text==='string'&&typeof x.time==='string'&&Number.isFinite(x.chance)).slice(0,100);}}catch{}renderSettings();refresh();renderHistory();
</script></body></html>
