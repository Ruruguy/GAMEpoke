</style></head><body><header><div class="brand"><span>✦</span>幸運球</div><div class="toolbar"><button class="tool" id="sound" aria-pressed="true" title="關閉音效">🔊 音效</button><button class="tool" id="toggleSettings">⚙ 設定</button><button class="tool" id="fullscreen">⛶ 全螢幕</button></div></header><main><div class="intro"><div class="eyebrow">LET’S GACHA!</div><h1>今天的幸運，轉出來！</h1><p>把彩球通通投入，再抽出今天的驚喜。準備好你的好運氣！</p></div><div class="layout"><section class="card settings-card"><h2>抽獎設定</h2><div class="sub">每一種顏色，都是一份期待</div><div id="groups"></div><button class="outline" id="add">＋ 新增組別</button><div class="total"><span>抽獎券總數</span><strong id="total">0 <small>張</small></strong></div><div class="note">可自訂名稱、顏色與票數，每張票都有獨立編號。投入後如需調整，請重新開始。</div></section><section class="card machine-card"><span class="status" id="status">等待投入抽獎券</span><div class="stage"><div class="glow"></div><div class="machine"><div class="dome" id="dome"></div><div class="pedestal"></div><div class="logo">★ LUCKY BALL ★</div><div class="slot"></div></div></div><div class="stats"><div class="stat"><b id="loaded">0</b><span>已投入</span></div><div class="stat"><b id="remaining">0</b><span>剩餘票數</span></div><div class="stat"><b id="drawn">0</b><span>已抽出</span></div></div><div class="result" id="result"><span style="font-size:13px;color:#8b9984">幸運，即將在這裡揭曉</span></div><div class="controls"><button class="secondary" id="load">↓ 投入抽獎券</button><button class="primary" id="draw" disabled>✦ 抽出幸運球</button></div><div class="message" id="message" role="status" aria-live="polite"></div><button class="reset" id="reset">↻ 重新開始</button></section><section class="card history-card"><div class="history-head"><h2>幸運紀錄</h2><button class="export" id="export">匯出 CSV</button></div><div class="sub">留下每一次幸運的瞬間</div><div id="history" class="history"></div></section></div><footer>每張票機會相同 · 抽出後不放回 · 紀錄自動保存在此瀏覽器</footer></main><script>
const $=id=>document.getElementById(id),KEY='lucky-draw-studio-v1';
let groups=[{id:1,name:'第一組',color:'#e9ac62',count:10},{id:2,name:'第二組',color:'#7599c4',count:10},{id:3,name:'第三組',color:'#c48c9d',count:10}],pool=[],history=[],active=false,busy=false,visual=[],raf,last=0;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.groups)&&Array.isArray(s.pool)&&Array.isArray(s.history)){groups=s.groups;pool=s.pool;history=s.history;active=!!s.active}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({groups,pool,history,active}))}catch(e){$('message').textContent='瀏覽器無法儲存，請匯出紀錄以保留結果。'}}
function total(){return groups.reduce((n,g)=>n+g.count,0)}
function renderGroups(){ $('groups').replaceChildren();groups.forEach(g=>{const wrap=document.createElement('div');wrap.className='group';const row=document.createElement('div');row.className='row';const c=document.createElement('input');c.type='color';c.value=g.color;c.className='color';c.setAttribute('aria-label','組別顏色');c.disabled=active||busy;c.oninput=()=>{g.color=c.value;save()};const name=document.createElement('input');name.className='label';name.value=g.name;name.maxLength=30;name.setAttribute('aria-label','組別名稱');name.disabled=active||busy;name.oninput=()=>{g.name=name.value;save()};const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','刪除組別');del.disabled=active||busy;del.onclick=()=>{groups=groups.filter(x=>x.id!==g.id);renderGroups();update();save()};row.append(c,name,del);const cr=document.createElement('div');cr.className='row countrow';const label=document.createElement('span');label.textContent='抽獎券數量';const n=document.createElement('input');n.type='number';n.min=0;n.max=10000;n.step=1;n.value=g.count;n.className='number';n.setAttribute('aria-label','抽獎券數量');n.disabled=active||busy;n.onchange=()=>{g.count=Math.min(10000,Math.max(0,Math.floor(Number(n.value)||0)));n.value=g.count;update();save()};cr.append(label,n);wrap.append(row,cr);$('groups').append(wrap)})}
function update(){const t=total();$('total').textContent=t+' 張';$('loaded').textContent=active?pool.length+history.length:0;$('remaining').textContent=pool.length;$('drawn').textContent=history.length;$('add').disabled=active||busy;$('load').disabled=active||busy||!t;$('draw').disabled=!active||busy||!pool.length;$('reset').disabled=busy;$('export').disabled=!history.length;$('status').textContent=busy?'幸運球轉動中…':!active?'等待投入抽獎券':pool.length?'準備好了，抽出你的幸運':'本輪抽獎已完成'}
function renderHistory(){const el=$('history');el.replaceChildren();if(!history.length){el.innerHTML='<div class="empty"><div class="empty-icon">♧</div>還沒有抽獎紀錄<br>第一份幸運，等你揭曉</div>';return}history.slice().reverse().forEach((t,i)=>{const entry=document.createElement('div');entry.className='entry';const dot=document.createElement('div');dot.className='dot';dot.style.background=t.color;dot.textContent=String(t.number).padStart(2,'0');const info=document.createElement('div');info.className='entryinfo';info.append(document.createTextNode(t.name));const time=document.createElement('small');time.textContent='票號 '+t.number+' · '+new Date(t.time).toLocaleTimeString('zh-TW',{hour12:false});info.append(time);const rank=document.createElement('span');rank.className='rank';rank.textContent='#'+(history.length-i);entry.append(dot,info,rank);el.append(entry)})}
function showResult(t){$('result').replaceChildren();const b=document.createElement('div');b.className='resultball';b.style.background=t.color;b.textContent=String(t.number).padStart(2,'0');const text=document.createElement('div');text.className='resulttext';const small=document.createElement('small');small.textContent='第 '+history.length+' 次幸運揭曉';const strong=document.createElement('strong');strong.textContent=t.name;const code=document.createElement('small');code.textContent='抽獎券 #'+String(t.number).padStart(3,'0');text.append(small,strong,code);$('result').append(b,text)}
function buildBalls(){visual=[];$('dome').replaceChildren();const sample=pool.length<=65?pool:Array.from({length:65},(_,i)=>pool[Math.floor(i*pool.length/65)]);sample.forEach((t,i)=>{const el=document.createElement('div');el.className='ball';el.style.background=t.color;el.textContent=t.number;const angle=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*95;const b={el,x:108+Math.cos(angle)*r,y:108+Math.sin(angle)*r,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2};el.style.transform=`translate(${b.x}px,${b.y}px)`;$('dome').append(el);visual.push(b)})}
function animate(now){const dt=Math.min((now-last)/16.67||1,2);last=now;for(const b of visual){const speed=busy?3.4:.45;b.x+=b.vx*speed*dt;b.y+=b.vy*speed*dt;const dx=b.x-108,dy=b.y-108,r=Math.hypot(dx,dy);if(r>106){const nx=dx/r,ny=dy/r,d=b.vx*nx+b.vy*ny;b.vx-=2*d*nx;b.vy-=2*d*ny;b.x=108+nx*105;b.y=108+ny*105}b.el.style.transform=`translate(${b.x}px,${b.y}px)`}raf=requestAnimationFrame(animate)}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
$('add').onclick=()=>{groups.push({id:Date.now(),name:'第 '+(groups.length+1)+' 組',color:['#88ae87','#b298cc','#db9677'][groups.length%3],count:10});renderGroups();update();save()};

// Synthesized locally: no audio downloads, and audio starts only after a click.
const Sound=(()=>{
 let context,master,enabled=true;
 try{enabled=localStorage.getItem('lucky-draw-sound')!=='off'}catch(e){}
 const voices=new Set();
 function sync(){const button=$('sound');button.textContent=enabled?'🔊 音效':'🔇 靜音';button.setAttribute('aria-pressed',String(enabled));button.title=enabled?'關閉音效':'開啟音效';if(master){master.gain.cancelScheduledValues(context.currentTime);master.gain.setTargetAtTime(enabled?.32:0,context.currentTime,.015)}}
 async function ready(){if(!enabled)return false;try{if(!context){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){enabled=false;sync();$('sound').disabled=true;$('sound').title='此瀏覽器不支援音效';return false}context=new Audio();master=context.createGain();master.gain.value=.32;master.connect(context.destination)}if(context.state==='suspended')await context.resume();return enabled&&context.state==='running'}catch(e){return false}}
 function tone(at,hz,duration=.1,volume=.3,type='sine',endHz=hz){const oscillator=context.createOscillator(),gain=context.createGain();oscillator.type=type;oscillator.frequency.setValueAtTime(hz,at);oscillator.frequency.exponentialRampToValueAtTime(Math.max(20,endHz),at+duration);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(volume,at+.008);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);oscillator.connect(gain);gain.connect(master);voices.add(oscillator);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();voices.delete(oscillator)};oscillator.start(at);oscillator.stop(at+duration+.02)}
 async function play(kind,duration=1){if(!await ready())return;const t=context.currentTime+.015;
 if(kind==='load'){const count=Math.min(24,Math.max(5,Math.floor(duration/.07)));for(let i=0;i<count;i++){const at=t+i*(duration-.1)/count;tone(at,540+(i%5)*85,.075,.22,'triangle',240)}tone(t+duration,784,.18,.22);tone(t+duration+.12,1046,.24,.2)}
 if(kind==='mix'){for(let i=0;i<24;i++){const at=t+i*.07;tone(at,180+(i%4)*45,.045,.16,'triangle',90);if(i%3===0)tone(at,750+(i%5)*80,.06,.09)}tone(t+1.62,420,.16,.25,'sine',840)}
 if(kind==='win'||kind==='finish'){[523.25,659.25,783.99,1046.5].forEach((hz,i)=>tone(t+i*.105,hz,i===3?.55:.2,.28,'triangle'));if(kind==='finish'){[1046.5,1318.5,1568].forEach((hz,i)=>tone(t+.65+i*.12,hz,.45,.2,'triangle'));tone(t+.65,523.25,.9,.12)}}
 }
 function toggle(){enabled=!enabled;if(!enabled&&context){for(const oscillator of voices){try{oscillator.stop()}catch(e){}}}sync();try{localStorage.setItem('lucky-draw-sound',enabled?'on':'off')}catch(e){}if(enabled)play('win')}
 sync();return {play,toggle};
})();
$('sound').onclick=Sound.toggle;

$('load').onclick=async()=>{if(busy||active||!total())return;if(groups.some(g=>!g.name.trim())){$('message').textContent='請先填寫每個組別的名稱。';return}busy=true;pool=groups.flatMap(g=>Array.from({length:g.count},(_,i)=>({groupId:g.id,name:g.name.trim(),color:g.color,number:i+1})));active=true;renderGroups();update();buildBalls();for(const [i,b]of visual.entries()){b.el.style.opacity=0;b.el.animate([{transform:`translate(${b.x}px,-50px)`,opacity:0},{transform:`translate(${b.x}px,${b.y}px)`,opacity:1}],{duration:650,delay:i*18,fill:'forwards',easing:'cubic-bezier(.3,.8,.5,1)'});b.el.style.opacity=1}Sound.play('load',(650+visual.length*18)/1000);await pause(650+visual.length*18);busy=false;$('message').textContent='所有抽獎券已投入，祝你好運！';update();save()};
function randomIndex(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
$('draw').onclick=async()=>{if(busy||!active||!pool.length)return;busy=true;update();$('message').textContent='攪拌中，幸運即將揭曉…';$('result').replaceChildren();Sound.play('mix');await pause(1800);const t=pool.splice(randomIndex(pool.length),1)[0];t.time=new Date().toISOString();history.push(t);save();buildBalls();showResult(t);Sound.play(pool.length?'win':'finish');celebrate();renderHistory();busy=false;update();$('message').textContent=pool.length?'恭喜！可以繼續抽出下一張。':'所有抽獎券已抽完，本輪圓滿結束！';if(!pool.length){$('machine')?.classList.add('finished');$('result').animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:700})}};
$('reset').onclick=()=>{if(busy)return;if(active&&!confirm('重新開始會清除本輪抽獎紀錄。需要保留請先匯出 CSV。確定重新開始？'))return;active=false;pool=[];history=[];visual=[];$('dome').replaceChildren();$('result').innerHTML='<span style="font-size:13px;color:#8b9984">幸運，即將在這裡揭曉</span>';$('message').textContent='新一輪的幸運，從這裡開始。';renderGroups();renderHistory();update();save()};
$('export').onclick=()=>{const cell=v=>'"'+String(v).replace(/^[=+@\-]/,"'").replaceAll('"','""')+'"';const csv='\uFEFF'+[['抽出順序','組別','票號','抽出時間'],...history.map((t,i)=>[i+1,t.name,t.number,new Date(t.time).toLocaleString('zh-TW',{hour12:false})])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='幸運球抽獎紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderGroups();renderHistory();update();buildBalls();if(history.length)showResult(history.at(-1));requestAnimationFrame(animate);

function fitMachine(){const stage=document.querySelector('.stage');const scale=Math.min((stage.clientHeight-28)/326,(stage.clientWidth-35)/290,2.4);stage.style.setProperty('--machine-scale',Math.max(.2,scale))}
new ResizeObserver(fitMachine).observe(document.querySelector('.stage'));fitMachine();
$('toggleSettings').onclick=()=>{if(document.body.classList.contains('presentation')){document.body.classList.toggle('settings-open')}else{document.body.classList.toggle('settings-hidden')}fitMachine()};
function syncFullscreen(){if(!document.fullscreenElement&&document.body.dataset.nativeFullscreen==='true'){document.body.classList.remove('presentation','settings-open');delete document.body.dataset.nativeFullscreen}$('fullscreen').textContent=document.body.classList.contains('presentation')?'⛶ 退出全螢幕':'⛶ 全螢幕';fitMachine()}
$('fullscreen').onclick=async()=>{if(document.body.classList.contains('presentation')){document.body.classList.remove('presentation','settings-open');if(document.fullscreenElement)await document.exitFullscreen();delete document.body.dataset.nativeFullscreen}else{document.body.classList.add('presentation');try{if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();document.body.dataset.nativeFullscreen='true'}}catch(e){/* The focused presentation layout also works without native fullscreen. */}}syncFullscreen()};
document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement){document.body.classList.remove('presentation','settings-open');syncFullscreen()}});
function celebrate(){const host=document.querySelector('.machine-card');for(let i=0;i<36;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#e77960','#f5cf6b','#7fa8d2','#9ab885','#c990b7'][i%5];c.style.setProperty('--drift',(Math.random()-.5)*350+'px');c.style.animationDelay=Math.random()*.4+'s';host.append(c);setTimeout(()=>c.remove(),2800)}}
</script></body></html>
